}

<!-- =============================================================================
     THREE.JS IMPORT MAP
     ============================================================================= -->

<script type="importmap">
{
    "imports": {
        "three": "https://esm.sh/three@0.160.0",
        "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
    }

<!-- =============================================================================
     MAIN APPLICATION SCRIPT
     ============================================================================= -->

<script type="module">
/* =============================================================================
   NA WHITECARD VIEWER - UI LOGIC
   =============================================================================
   
   FILE       : Na__ProtoType__WhitecardViewer__WithLines__1.4.0__.html
   AUTHOR     : Noble Architecture
   PURPOSE    : 3D rendering logic for whitecard viewer
   CREATED    : 2026
   
   DESCRIPTION:
   - Three.js scene setup with post-processing
   - GLTF/GLB file loading for base mesh and linework
   - Fat line rendering using Line2 system
   - Camera controls and movement
   
   NAMING CONVENTION:
   - All custom identifiers use na_ prefix
   - Constants use NA_ prefix
   
   ============================================================================= */

// =============================================================================
// REGION | Imports
// =============================================================================

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Fat Lines (Line2 system for thick lines)
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';

// Post Processing
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';

// endregion ===================================================================

// =============================================================================
// REGION | Configuration Constants
// =============================================================================

// CONSTANTS | Unit Conversion (Base unit: millimeters)
// ------------------------------------------------------------
const NA_MM_TO_METERS = 0.001;      // <-- GLB uses meters, we think in mm

// CONSTANTS | Rendering Configuration
// ------------------------------------------------------------
const NA_CONFIG = {
    bgColor: 0xffffff,
    edgeColor: 0x000000,
    lineWidth: 2.5,                  // <-- Screen pixels for line width
    ambientIntensity: 2.5,          // <-- Balanced ambient light
    dirLightIntensity: 1.0,         // <-- Balanced directional light
    shadowOpacity: 0.10,            // <-- Subtle shadows for depth
    cameraFov: 45,
    cameraNear: 0.1,                // <-- 100mm near plane
    cameraFar: 1000,                // <-- 1000m far plane
    fogDensity: 0.0003,             // <-- Very subtle fog
    groundSize: 500,                // <-- 500m ground plane
    groundYOffset: -0.05,           // <-- 50mm below origin
    movementSpeed: 0.5,             // <-- 500mm per key press
    statusHideDelay: 3000,
    enableSSAO: true,               // <-- ENABLED for tight corner occlusion
    enableDamping: false            // <-- Disable camera damping to stop settling animation
};

// CONSTANTS | SSAO Configuration (Tight corner occlusion 50-100mm)
// ------------------------------------------------------------
// NOTE: All SSAO distances are in METERS (GLB standard)
// 50mm = 0.05m, 75mm = 0.075m, 100mm = 0.1m
const NA_SSAO_CONFIG = {
    kernelRadius: 0.075,            // <-- 75mm radius (middle of 50-100mm range)
    minDistance: 0.001,             // <-- 1mm minimum distance for tight corners
    maxDistance: 0.1,               // <-- 100mm maximum occlusion distance
    kernelSize: 32,                 // <-- Higher quality sampling
    outputMode: 0                   // <-- 0 = combined (AO blended with scene)
};

// CONSTANTS | Material Configuration
// ------------------------------------------------------------
const NA_MATERIAL_CONFIG = {
    whiteColor: 0xffffff,           // <-- Pure white base color
    roughness: 1.0,                 // <-- Full roughness for flat paper look
    metalness: 0.0,                 // <-- Non-metallic (paper/card)
    polygonOffsetFactor: 2,         // <-- Pushes faces BACK (depth bias)
    polygonOffsetUnits: 2,          // <-- Depth units for polygon offset
    emissiveBoost: 0x333333,        // <-- Subtle brightness boost for untextured
    textureEmissive: 0x444444       // <-- Moderate emissive for texture maps
};

// CONSTANTS | Line Configuration (mm-based thinking)
// ------------------------------------------------------------
const NA_LINE_CONFIG = {
    polygonOffsetFactor: -4,        // <-- Negative = push lines TOWARD camera
    polygonOffsetUnits: -4,         // <-- Depth units for line offset
    renderOrder: 999                // <-- Draw lines last (on top of faces)
};

// endregion ===================================================================

// =============================================================================
// REGION | UI Element References
// =============================================================================

const na_statusBox = document.getElementById('na-status-container');
const na_loadingText = document.getElementById('na-loading-text');
const na_errorLog = document.getElementById('na-error-log');
const na_fileInputBase = document.getElementById('na-file-input-base');
const na_fileInputLines = document.getElementById('na-file-input-lines');

// endregion ===================================================================

// =============================================================================
// REGION | UI Helper Functions
// =============================================================================

// FUNCTION | Update Status Display
// ------------------------------------------------------------
// @param msg [String] Status message to display
// @param isError [Boolean] Whether this is an error message
function na_updateStatus(msg, isError = false) {
    na_statusBox.style.display = 'block';
    na_loadingText.textContent = msg;
    na_loadingText.style.color = isError ? 'var(--na-accent-error)' : 'var(--na-accent-blue)';
    na_statusBox.style.borderLeftColor = isError ? 'var(--na-accent-error)' : 'var(--na-accent-blue)';
    
    if (!isError) {
        na_errorLog.style.display = 'none';
        setTimeout(() => {
            if (na_loadingText.textContent === msg) {
                na_statusBox.style.display = 'none';
            }
        }, NA_CONFIG.statusHideDelay);
    } else {
        na_errorLog.style.display = 'block';
        na_errorLog.textContent = msg;
    }
}

// endregion ===================================================================

// =============================================================================
// REGION | Scene Setup
// =============================================================================

// CONSTANTS | Scene Objects
// ------------------------------------------------------------
const na_scene = new THREE.Scene();
na_scene.background = new THREE.Color(NA_CONFIG.bgColor);
na_scene.fog = new THREE.FogExp2(NA_CONFIG.bgColor, NA_CONFIG.fogDensity);

const na_camera = new THREE.PerspectiveCamera(
    NA_CONFIG.cameraFov,
    window.innerWidth / window.innerHeight,
    NA_CONFIG.cameraNear,
    NA_CONFIG.cameraFar
);
na_camera.position.set(30, 20, 30);

const na_renderer = new THREE.WebGLRenderer({
    antialias: true,                 // <-- Enable native MSAA for crisp lines
    alpha: true,
    powerPreference: "high-performance",
    stencil: true,
    depth: true,
    logarithmicDepthBuffer: true    // Helps depth precision
});
na_renderer.setSize(window.innerWidth, window.innerHeight);
na_renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
na_renderer.shadowMap.enabled = true;
na_renderer.shadowMap.type = THREE.PCFSoftShadowMap;
na_renderer.outputColorSpace = THREE.SRGBColorSpace;
na_renderer.toneMapping = THREE.NoToneMapping;      // <-- Pure whites, no compression
na_renderer.toneMappingExposure = 1.0;              // <-- Neutral exposure
document.body.appendChild(na_renderer.domElement);

// CONSTANTS | Line Resolution (for LineMaterial)
// ------------------------------------------------------------
const na_lineResolution = new THREE.Vector2(window.innerWidth, window.innerHeight);

// endregion ===================================================================

// =============================================================================
// REGION | Lighting Setup
// =============================================================================

// CONSTANTS | Ambient Light
// ------------------------------------------------------------
const na_ambientLight = new THREE.AmbientLight(0xffffff, NA_CONFIG.ambientIntensity);
na_scene.add(na_ambientLight);

// CONSTANTS | Directional Light
// ------------------------------------------------------------
const na_dirLight = new THREE.DirectionalLight(0xffffff, NA_CONFIG.dirLightIntensity);
na_dirLight.position.set(50, 100, 40);
na_dirLight.castShadow = true;
na_dirLight.shadow.mapSize.width = 2048;
na_dirLight.shadow.mapSize.height = 2048;
na_dirLight.shadow.bias = -0.0001;
na_scene.add(na_dirLight);

// CONSTANTS | Ground Plane (Shadow Receiver)
// ------------------------------------------------------------
const na_planeGeo = new THREE.PlaneGeometry(NA_CONFIG.groundSize, NA_CONFIG.groundSize);
const na_planeMat = new THREE.ShadowMaterial({
    opacity: NA_CONFIG.shadowOpacity,
    color: 0x000000
});
const na_plane = new THREE.Mesh(na_planeGeo, na_planeMat);
na_plane.rotation.x = -Math.PI / 2;
na_plane.position.y = NA_CONFIG.groundYOffset;
na_plane.receiveShadow = true;
na_scene.add(na_plane);

// endregion ===================================================================

// =============================================================================
// REGION | Post Processing Setup
// =============================================================================

// CONSTANTS | Multisampled Render Target for MSAA preservation
// ------------------------------------------------------------
const na_renderTargetParams = {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat,
    type: THREE.HalfFloatType,
    samples: 4                       // <-- 4x MSAA samples
};
const na_renderTarget = new THREE.WebGLRenderTarget(
    window.innerWidth * na_renderer.getPixelRatio(),
    window.innerHeight * na_renderer.getPixelRatio(),
    na_renderTargetParams
);

const na_composer = new EffectComposer(na_renderer, na_renderTarget);
na_composer.addPass(new RenderPass(na_scene, na_camera));

// CONSTANTS | SSAO Pass (Tight 50-100mm corner occlusion)
// ------------------------------------------------------------
let na_ssaoPass = null;
if (NA_CONFIG.enableSSAO) {
    na_ssaoPass = new SSAOPass(na_scene, na_camera, window.innerWidth, window.innerHeight);
    na_ssaoPass.kernelRadius = NA_SSAO_CONFIG.kernelRadius;   // 75mm occlusion radius
    na_ssaoPass.minDistance = NA_SSAO_CONFIG.minDistance;     // 1mm min distance
    na_ssaoPass.maxDistance = NA_SSAO_CONFIG.maxDistance;     // 100mm max distance
    na_ssaoPass.kernelSize = NA_SSAO_CONFIG.kernelSize;       // 32 samples for quality
    na_ssaoPass.output = NA_SSAO_CONFIG.outputMode;           // Combined output mode
    na_composer.addPass(na_ssaoPass);
}

// CONSTANTS | FXAA Pass (additional AA on top of MSAA)
// ------------------------------------------------------------
const na_fxaaPass = new ShaderPass(FXAAShader);
const na_pixelRatio = na_renderer.getPixelRatio();
na_fxaaPass.material.uniforms['resolution'].value.x = 1 / (window.innerWidth * na_pixelRatio);
na_fxaaPass.material.uniforms['resolution'].value.y = 1 / (window.innerHeight * na_pixelRatio);
na_composer.addPass(na_fxaaPass);

// endregion ===================================================================

// =============================================================================
// REGION | Loader and Controls Setup
// =============================================================================

const na_loader = new GLTFLoader();
const na_controls = new OrbitControls(na_camera, na_renderer.domElement);
na_controls.enableDamping = NA_CONFIG.enableDamping;  // <-- Configurable damping

const na_modelGroup = new THREE.Group();
na_scene.add(na_modelGroup);

let na_baseMeshObj = null;
let na_linesMeshObj = null;

// endregion ===================================================================

// =============================================================================
// REGION | Camera Helper Functions
// =============================================================================

// FUNCTION | Recenter Camera on Model
// ------------------------------------------------------------
function na_recenterCamera() {
    const box = new THREE.Box3().setFromObject(na_modelGroup);
    if (box.isEmpty()) return;
    
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    
    na_modelGroup.position.sub(center);
    na_modelGroup.position.y += size.y / 2;
    
    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) {
        na_camera.position.set(maxDim * 1.5, maxDim * 0.8, maxDim * 1.5);
        na_controls.target.set(0, size.y / 2, 0);
    }
}

// endregion ===================================================================

// =============================================================================
// REGION | Base Mesh Loader
// =============================================================================

// FUNCTION | Load Base Mesh (Faces)
// ------------------------------------------------------------
na_fileInputBase.addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    na_updateStatus("Loading Base Mesh...");
    const url = URL.createObjectURL(file);

    na_loader.load(url, (gltf) => {
        if (na_baseMeshObj) {
            na_modelGroup.remove(na_baseMeshObj);
        }
        
        na_baseMeshObj = gltf.scene;
        
        // CONSTANTS | White Material for Base Mesh
        // ------------------------------------------------------------
        const na_whiteMat = new THREE.MeshStandardMaterial({
            color: NA_MATERIAL_CONFIG.whiteColor,
            roughness: NA_MATERIAL_CONFIG.roughness,
            metalness: NA_MATERIAL_CONFIG.metalness,
            side: THREE.DoubleSide,
            polygonOffset: true,
            polygonOffsetFactor: NA_MATERIAL_CONFIG.polygonOffsetFactor,
            polygonOffsetUnits: NA_MATERIAL_CONFIG.polygonOffsetUnits
        });

        na_baseMeshObj.traverse((node) => {
            if (node.isMesh) {
                node.castShadow = true;
                node.receiveShadow = true;

                // Preserve existing textures but boost brightness for whitecard look
                if (node.material && (node.material.map || node.material.emissiveMap)) {
                    // Clone material to avoid affecting shared materials
                    node.material = node.material.clone();
                    node.material.side = THREE.DoubleSide;
                    node.material.polygonOffset = true;
                    node.material.polygonOffsetFactor = NA_MATERIAL_CONFIG.polygonOffsetFactor;
                    node.material.polygonOffsetUnits = NA_MATERIAL_CONFIG.polygonOffsetUnits;
                    
                    // Strong emissive boost for bright whitecard texture appearance
                    node.material.emissive = new THREE.Color(NA_MATERIAL_CONFIG.textureEmissive);
                    node.material.emissiveIntensity = 1.0;
                    
                    // Use the diffuse map as emissive map for full brightness
                    if (node.material.map && !node.material.emissiveMap) {
                        node.material.emissiveMap = node.material.map;
                    }
                    
                    // Reduce influence of lighting on textured surfaces
                    node.material.roughness = 1.0;
                    node.material.metalness = 0.0;
                } else {
                    node.material = na_whiteMat;
                }
            }
        });

        na_modelGroup.add(na_baseMeshObj);
        na_recenterCamera();
        na_updateStatus("Base Mesh Loaded");
        URL.revokeObjectURL(url);
    }, undefined, (err) => {
        na_updateStatus("Base Mesh Error: " + err.message, true);
    });
});

// endregion ===================================================================

// =============================================================================
// REGION | Linework Loader (Fat Lines with Line2 System)
// =============================================================================

// FUNCTION | Load Linework (Fat Lines)
// ------------------------------------------------------------
na_fileInputLines.addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    na_updateStatus("Loading Linework...");
    const url = URL.createObjectURL(file);

    na_loader.load(url, (gltf) => {
        if (na_linesMeshObj) {
            na_modelGroup.remove(na_linesMeshObj);
        }
        
        na_linesMeshObj = gltf.scene;

        // Collect nodes to replace (can't modify during traverse)
        const na_nodesToReplace = [];
        
        na_linesMeshObj.traverse((node) => {
            // Ruby script exports GL_LINES (mode 1), which loads as LineSegments
            if (node.isLineSegments || node.isLine) {
                na_nodesToReplace.push(node);
            }
        });

        // Replace each line with a fat LineSegments2
        na_nodesToReplace.forEach((node) => {
            // Get positions from original geometry
            const positions = node.geometry.attributes.position.array;
            
            // Create new fat line geometry
            const na_lineGeo = new LineSegmentsGeometry();
            na_lineGeo.setPositions(positions);
            
            // Create fat line material with polygon offset to push lines FORWARD
            const na_lineMat = new LineMaterial({
                color: NA_CONFIG.edgeColor,
                linewidth: NA_CONFIG.lineWidth,
                resolution: na_lineResolution,
                worldUnits: false,                                  // Use screen-space pixels
                depthTest: true,
                depthWrite: true,                                   // Enable depth write
                polygonOffset: true,                                // Enable polygon offset
                polygonOffsetFactor: NA_LINE_CONFIG.polygonOffsetFactor,  // Push TOWARD camera
                polygonOffsetUnits: NA_LINE_CONFIG.polygonOffsetUnits     // Depth bias units
            });
            
            // Create fat line object
            const na_fatLine = new LineSegments2(na_lineGeo, na_lineMat);
            na_fatLine.computeLineDistances();
            na_fatLine.frustumCulled = false;
            na_fatLine.renderOrder = NA_LINE_CONFIG.renderOrder;    // Draw lines LAST
            
            // Copy transform from original node
            na_fatLine.position.copy(node.position);
            na_fatLine.rotation.copy(node.rotation);
            na_fatLine.scale.copy(node.scale);
            na_fatLine.matrix.copy(node.matrix);
            na_fatLine.matrixAutoUpdate = node.matrixAutoUpdate;
            
            // Add to parent (or scene root if no parent)
            if (node.parent) {
                node.parent.add(na_fatLine);
                node.parent.remove(node);
            } else {
                na_linesMeshObj.add(na_fatLine);
            }
            
            // Dispose old geometry
            node.geometry.dispose();
        });

        // Set render order so lines draw after faces (backup for group level)
        na_linesMeshObj.renderOrder = 100;

        na_modelGroup.add(na_linesMeshObj);
        if (!na_baseMeshObj) {
            na_recenterCamera();
        }
        
        na_updateStatus("Linework Loaded");
        URL.revokeObjectURL(url);
    }, undefined, (err) => {
        na_updateStatus("Linework Error: " + err.message, true);
    });
});

// endregion ===================================================================

// =============================================================================
// REGION | Window Resize Handler
// =============================================================================

window.addEventListener('resize', () => {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const pixelRatio = na_renderer.getPixelRatio();
    
    na_camera.aspect = width / height;
    na_camera.updateProjectionMatrix();
    na_renderer.setSize(width, height);
    
    // Resize MSAA render target
    na_renderTarget.setSize(width * pixelRatio, height * pixelRatio);
    na_composer.setSize(width, height);
    
    // Update FXAA resolution
    na_fxaaPass.material.uniforms['resolution'].value.x = 1 / (width * pixelRatio);
    na_fxaaPass.material.uniforms['resolution'].value.y = 1 / (height * pixelRatio);
    
    // Update line resolution for LineMaterial
    na_lineResolution.set(width, height);
});

// endregion ===================================================================

// =============================================================================
// REGION | Camera Movement (WASD Fly Controls)
// =============================================================================

const na_keys = { w: false, a: false, s: false, d: false };

window.addEventListener('keydown', (e) => {
    na_keys[e.key.toLowerCase()] = true;
});

window.addEventListener('keyup', (e) => {
    na_keys[e.key.toLowerCase()] = false;
});

// FUNCTION | Update Camera Movement
// ------------------------------------------------------------
function na_updateMovement() {
    if (!na_keys.w && !na_keys.a && !na_keys.s && !na_keys.d) return;
    
    const forward = new THREE.Vector3();
    na_camera.getWorldDirection(forward);
    forward.y = 0;
    forward.normalize();
    
    const right = new THREE.Vector3().crossVectors(forward, na_camera.up).normalize();

    if (na_keys.w) {
        na_camera.position.add(forward.multiplyScalar(NA_CONFIG.movementSpeed));
    }
    if (na_keys.s) {
        na_camera.position.sub(forward.multiplyScalar(NA_CONFIG.movementSpeed));
    }
    if (na_keys.d) {
        na_camera.position.add(right.multiplyScalar(NA_CONFIG.movementSpeed));
    }
    if (na_keys.a) {
        na_camera.position.sub(right.multiplyScalar(NA_CONFIG.movementSpeed));
    }
    
    na_controls.update();
}

// endregion ===================================================================

// =============================================================================
// REGION | Animation Loop
// =============================================================================

// FUNCTION | Animation Loop
// ------------------------------------------------------------
function na_animate() {
    requestAnimationFrame(na_animate);
    na_updateMovement();
    na_controls.update();
    na_composer.render();
}

na_animate();

// endregion ===================================================================

</script>
