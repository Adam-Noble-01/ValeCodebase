# =============================================================================
# VALE APPS - NGINX SITE BODY (GENERATED - DO NOT EDIT ON THE SERVER)
# =============================================================================
# Source : WebApps/Vale__VirtualServerManager/01__AppData/VirtualServerManager__UrlRoutes__.json
# Edit   : Vale Virtual Server Manager, tab 03 URL Configurator, then Apply
# Lives  : /etc/nginx/snippets/vale-site.conf, included by /etc/nginx/sites-available/app
# =============================================================================

root /srv/vale;
index index.html;
client_max_body_size 100M;
add_header Cache-Control "no-cache" always;

# ---- File types missing from nginx 1.24's mime.types (.mjs must be JavaScript or browsers refuse the module).
#      A types block here replaces the inherited table, so the full table is included first.
include /etc/nginx/mime.types;
types { application/javascript mjs; application/manifest+json webmanifest; model/gltf-binary glb; model/gltf+json gltf; }

# ---- Never web-served (every Server__ folder: APIs, tools, user accounts)
location ^~ /Server__                { return 404; }
location ~ /\.                        { return 404; }
location ~* \.(md|py|pyc|sh|bat|ps1|env|log|bak|lock|tmp|example|code-workspace)$ { return 404; }
location ~ /(?:[^/]*__)?(?:UserData|UserConfig|ServerData|Revisions)(?:__[^/]*)?/ { return 404; }

# ---- Private files streamed by the Flask APIs (X-Accel-Redirect: /_internal/<path under the root>)
#      ^~ so the deny rules above never see it (they would 404 every UserData file); internal = APIs only
location ^~ /_internal/ { internal; alias /srv/vale/; }

# ---- Library files that open only for a Vale sign-in or a live client link to that project (each app
#      route's LibraryProtected). nginx asks the app's API first (auth_request, the file's normalised path
#      in X-Vale-Library-Path): a 2xx sends the file, a 401 or 403 refuses it, anything else is a 500.
#      private: Cloudflare and every other shared cache never keep a copy. LibraryHidden folders, and the
#      protected ones of a route switched off, are never served. Below the denies, so those still win.
location ~ ^/Vale__Projects__MasterLibrary/[^/]+/[^/]+/(?:ValeVision__TheiaVideo/AppData__VideoData/) { return 404; }
# ProjectData__*.json, ValeVision3D/Content__3dModel__GlbFiles/, ValeVision3D/Content__3dModel__AppGenerated/, ValeVision3D/Content__SitePlanData/  ->  the /valevision/ API decides
location = /_vale_library_access/valevision { internal; proxy_pass http://127.0.0.1:8002/api/library-access; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header X-Vale-Library-Path $vale_library_path; include snippets/proxy-common.conf; }
location ~ ^/Vale__Projects__MasterLibrary/[^/]+/[^/]+/(?:ProjectData__[^/]*\.json$|ValeVision3D/Content__3dModel__GlbFiles/|ValeVision3D/Content__3dModel__AppGenerated/|ValeVision3D/Content__SitePlanData/) { set $vale_library_path $uri; auth_request /_vale_library_access/valevision; add_header Cache-Control "private, no-cache" always; }
# ValeVision__TheiaVideo/Content__VideoFiles/  ->  the /theia/ API decides
location = /_vale_library_access/theia { internal; proxy_pass http://127.0.0.1:8005/api/library-access; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header X-Vale-Library-Path $vale_library_path; include snippets/proxy-common.conf; }
location ~ ^/Vale__Projects__MasterLibrary/[^/]+/[^/]+/(?:ValeVision__TheiaVideo/Content__VideoFiles/) { set $vale_library_path $uri; auth_request /_vale_library_access/theia; add_header Cache-Control "private, no-cache" always; }

# ---- App routes (query strings pass straight through to the app)
# /valevision/  ->  Vale__ValeVision3D/index.html   (ValeVision 3D (URL from the email to Shane))
location = /valevision { return 301 /valevision/$is_args$args; }
location ^~ /valevision/api/ { proxy_pass http://127.0.0.1:8002/api/; include snippets/proxy-common.conf; }
location /valevision/ { alias /srv/vale/Vale__ValeVision3D/; index index.html; }

# /valespec/  ->  Vale__ValeSpec/index.html   (ValeSpec (URL from the email to Shane))
location = /valespec { return 301 /valespec/$is_args$args; }
location /valespec/ { alias /srv/vale/Vale__ValeSpec/; index index.html; }

# /lantern-designer/  ->  Vale__LanternDesigner/index.html   (Lantern Designer (URL from the email to Shane); API vale@LanternDesigner on 8003 since 15-Oct-2026)
location = /lantern-designer { return 301 /lantern-designer/$is_args$args; }
location ^~ /lantern-designer/api/ { proxy_pass http://127.0.0.1:8003/api/; include snippets/proxy-common.conf; }
location /lantern-designer/ { alias /srv/vale/Vale__LanternDesigner/; index index.html; }

# /project-gallery/  ->  Vale__ValeVisionGallery/index.html   (ValeVision Gallery - suggested short path, change freely)
location = /project-gallery { return 301 /project-gallery/$is_args$args; }
location ^~ /project-gallery/api/ { proxy_pass http://127.0.0.1:8001/api/; include snippets/proxy-common.conf; }
location /project-gallery/ { alias /srv/vale/Vale__ValeVisionGallery/; index index.html; }

# /help/  ->  Vale__ValeVision__Help/index.html   (ValeVision Help: install guides (/help/install-app/?app=valevision&device=ios))
location = /help { return 301 /help/$is_args$args; }
location /help/ { alias /srv/vale/Vale__ValeVision__Help/; index index.html; }

# /theia/  ->  Vale__ValeVision__TheiaVideoPlayer/index.html   (ValeVision Theia video player (API vale@ValeVision__TheiaVideoPlayer on 8005))
location = /theia { return 301 /theia/$is_args$args; }
location ^~ /theia/api/ { proxy_pass http://127.0.0.1:8005/api/; include snippets/proxy-common.conf; }
location /theia/ { alias /srv/vale/Vale__ValeVision__TheiaVideoPlayer/; index index.html; }

