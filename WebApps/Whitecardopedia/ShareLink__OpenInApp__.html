<!DOCTYPE html>
<!-- =============================================================================
     WHITECARDOPEDIA - SHARE LINK HANDOVER PAGE
     =============================================================================
     
     FILE       : ShareLink__OpenInApp__.html
     NAMESPACE  : Whitecardopedia
     VERSION    : 0.4.1 - PWA Email Link Capture (Open Share Links in App)
     AUTHOR     : Adam Noble - Noble Architecture
     PURPOSE    : Three-state handover page for share-link emails
     CREATED    : 2026
     
     DESCRIPTION:
     - Sits inside the PWA scope so the launch_handler can reuse the existing
       standalone window when a recipient clicks the link.
     - Loads the same install / platform / URL-builder module stack as app.html
       so install prompts, protocol launches, and direct-forward all work from
       this single entry point.
     - Whitecardopedia__AppLinkCapture__HandoverPage__ runs on DOM ready and
       picks one of three states: standalone forward, installed protocol
       redirect, or not-installed install invitation.
     
     QUERY PARAMETERS:
     - ?project=<projectCode>            : Direct project share (default)
     - ?protocol=web+valevision%3A...     : Protocol launch from custom scheme
     
     ============================================================================= -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open in ValeVision 3D</title>
    
    <!-- ----------------------------------------------------------------- -->
    <!-- SEARCH ENGINE BLOCKING | Prevent Indexing and Crawling            -->
    <!-- ----------------------------------------------------------------- -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    
    <!-- ----------------------------------------------------------------- -->
    <!-- BRANDING | Favicon, Brand Icons & PWA Manifest                    -->
    <!-- ----------------------------------------------------------------- -->
    <link rel="icon" type="image/svg+xml" href="../assets__CommonApplicationAssets/AppIcons/Icon__MainValeIcon__.svg">
    <link rel="apple-touch-icon" sizes="192x192" href="02__Src__AppModules/62__Feature__AppInstallability/Na__AppInstallability__Icon__192x192.png">
    <link rel="apple-touch-icon" href="02__Src__AppModules/62__Feature__AppInstallability/Na__AppInstallability__Icon__192x192.png">
    <link rel="manifest" href="02__Src__AppModules/62__Feature__AppInstallability/Whitecardopedia__Pwa__Manifest__.webmanifest">
    <meta name="theme-color" content="#172b3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ValeVision 3D">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="ValeVision 3D">
    
    <!-- ----------------------------------------------------------------- -->
    <!-- STYLES | Application Stylesheets                                  -->
    <!-- ----------------------------------------------------------------- -->
    <link rel="stylesheet" href="03__Style__AppStylesheets/Na__CoreUi__Styles__Index__.css">
    
</head>
<body class="walc-handover-page">
    <!-- ----------------------------------------------------------------- -->
    <!-- HANDOVER CARD | Spinner / Title / Body / Project Chip / Actions   -->
    <!-- ----------------------------------------------------------------- -->
    <main id="WalcHandoverRoot" class="walc-handover" role="dialog" aria-live="polite">
        <div class="walc-handover__brand">
            <img
                src="02__Src__AppModules/62__Feature__AppInstallability/Na__AppInstallability__Icon__192x192.png"
                alt="ValeVision 3D"
                draggable="false"
            />
        </div>
        
        <div id="WalcHandoverSpinner" class="walc-handover__spinner" aria-hidden="true"></div>
        
        <h1 id="WalcHandoverTitle" class="walc-handover__title">Opening ValeVision 3D...</h1>
        
        <p id="WalcHandoverBody" class="walc-handover__body">Hand-off in progress.</p>
        
        <span id="WalcHandoverProjectCode" class="walc-handover__chip"></span>
        
        <div id="WalcHandoverActions" class="walc-handover__actions walc-handover--hidden"></div>
        
        <div id="WalcHandoverHintSlot" class="walc-handover__hint-slot"></div>
        
        <div id="WalcHandoverTooltipSlot" class="walc-handover__tooltip-slot"></div>
    </main>
    
    <!-- ----------------------------------------------------------------- -->
    <!-- PWA INSTALLABILITY | Modular install prompt + service worker stack -->
    <!-- ----------------------------------------------------------------- -->
    <script src="02__Src__AppModules/62__Feature__AppInstallability/Whitecardopedia__Pwa__Url__Constructor__.js"></script>
    <script src="02__Src__AppModules/62__Feature__AppInstallability/Whitecardopedia__Pwa__PlatformDetector__.js"></script>
    <script src="02__Src__AppModules/62__Feature__AppInstallability/Whitecardopedia__Pwa__SessionState__.js"></script>
    <script src="02__Src__AppModules/62__Feature__AppInstallability/Whitecardopedia__Pwa__PromptUi__.js"></script>
    <script src="02__Src__AppModules/62__Feature__AppInstallability/Whitecardopedia__Pwa__Handler__Chromium__.js"></script>
    <script src="02__Src__AppModules/62__Feature__AppInstallability/Whitecardopedia__Pwa__Handler__IosSafari__.js"></script>
    <script src="02__Src__AppModules/62__Feature__AppInstallability/Whitecardopedia__Pwa__Handler__IosNonSafari__.js"></script>
    <script src="02__Src__AppModules/62__Feature__AppInstallability/Whitecardopedia__Pwa__Handler__MacSafari__.js"></script>
    <script src="02__Src__AppModules/62__Feature__AppInstallability/Whitecardopedia__Pwa__Handler__InstalledStandalone__.js"></script>
    <script src="02__Src__AppModules/62__Feature__AppInstallability/Whitecardopedia__Pwa__InstallController__.js"></script>
    <script src="02__Src__AppModules/62__Feature__AppInstallability/Whitecardopedia__Pwa__ServiceWorker__Registrar__.js"></script>
    
    <!-- ----------------------------------------------------------------- -->
    <!-- IN-APP NAVIGATION HELPERS | Same-client routing                   -->
    <!-- ----------------------------------------------------------------- -->
    <script src="02__Src__AppModules/61__Feature__PwaAppHelpers/Na__Feature__PwaAppHelpers__AppScopeNavigation__Logic__.js"></script>
    
    <!-- ----------------------------------------------------------------- -->
    <!-- APP LINK CAPTURE | Handover orchestration + protocol handler      -->
    <!-- ----------------------------------------------------------------- -->
    <script src="02__Src__AppModules/63__Feature__AppLinkCapture/Whitecardopedia__AppLinkCapture__UrlBuilder__.js"></script>
    <script src="02__Src__AppModules/63__Feature__AppLinkCapture/Whitecardopedia__AppLinkCapture__ProtocolHandler__.js"></script>
    <script src="02__Src__AppModules/63__Feature__AppLinkCapture/Whitecardopedia__AppLinkCapture__OptInTooltip__.js"></script>
    <script src="02__Src__AppModules/63__Feature__AppLinkCapture/Whitecardopedia__AppLinkCapture__HandoverPage__.js"></script>
    
</body>
</html>
