    <script>
        // SET BASE TAG DYNAMICALLY
        (function() {
            const base = document.createElement('base');
            if (window.location.hostname.includes('github.io')) {
                const pathname = window.location.pathname;
                if (pathname.includes('/ValeCodebase/WebApps/Whitecardopedia/')) {
                    base.href = '/ValeCodebase/WebApps/Whitecardopedia/';
                } else {
                    base.href = '/';
                }
            } else {
                base.href = '/';
            }
            document.head.insertBefore(base, document.head.firstChild.nextSibling);
        })();
    </script>
