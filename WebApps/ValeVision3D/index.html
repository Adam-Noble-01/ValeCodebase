    <!-- REGION  |  Font Loading Detection Script                          -->
    <!-- ----------------------------------------------------------------- -->
    
    <script>
        // FUNCTION | DetectFontLoading - Monitors Open Sans font loading
        // --------------------------------------------------------
        (function detectFontLoading() {
            if ('fonts' in document) {
                // Modern Font Loading API
                // ------------------------------------
                Promise.all([
                    document.fonts.load('400 1em "Open Sans"'),
                    document.fonts.load('600 1em "Open Sans"'),
                    document.fonts.load('300 1em "Open Sans"')
                ]).then(function() {
                    console.log('=== Custom Fonts Loaded ===');
                    console.log('Open Sans Regular (400) - Loaded');
                    console.log('Open Sans SemiBold (600) - Loaded');
                    console.log('Open Sans Light (300) - Loaded');
                    console.log('===========================');
                }).catch(function(error) {
                    console.warn('Font loading failed, using fallback fonts:', error);
                });
                
                // Monitor overall font loading state
                // ------------------------------------
                document.fonts.ready.then(function() {
                    console.log('All fonts ready for use');
                });
                
            } else {
                // Fallback for browsers without Font Loading API
                // ------------------------------------
                console.log('Font Loading API not supported, fonts will load naturally');
            }
        })();
        // --------------------------------------------------------
    </script>

<body>
    <!-- ----------------------------------------------------------------- -->

    <!-- ----------------------------------------------------------------- -->
    <!-- REGION  |  Babylon.js Application Logic                           -->
    <!-- ----------------------------------------------------------------- -->

    <script>
        // #Region ------------------------------------------------
        // BABYLON.JS SETUP | Initialize engine, scene, camera, and lighting with event-driven loading
        // --------------------------------------------------------
        
        const canvas = document.getElementById('renderCanvas');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const statusText = document.getElementById('statusText');
        
        // Create Babylon engine with antialiasing
        // ------------------------------------
        const engine = new BABYLON.Engine(canvas, true, {
            preserveDrawingBuffer: true,
            stencil: true
        });


        // FUNCTION | CreateScene - Sets up the basic 3D scene
        // --------------------------------------------------------
        function createScene() {
            // Update status
            // ------------------------------------
            if (statusText) statusText.textContent = 'Creating scene...';
            console.log('Creating Babylon.js scene...');
            
            
            // Create scene
            // ------------------------------------
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(1.0, 1.0, 1.0);  // <-- White background matching ValeVision3D


            // Setup UniversalCamera navigation
            // ------------------------------------
            if (statusText) statusText.textContent = 'Setting up camera...';
            console.log('Setting up camera...');
            const camera = setupUniversalCamera(scene, canvas);


            // Setup scene lighting
            // ------------------------------------
            if (statusText) statusText.textContent = 'Configuring lighting...';
            console.log('Configuring lighting...');
            setupSceneLighting(scene);


            // NOTE: Rendering pipeline is now applied AFTER materials are ready
            // This prevents black flash during initialization
            // ------------------------------------


            console.log('=========================================');
            console.log('=== Scene Initialized - Ready to Load Model ===');
            console.log('=========================================');


            return scene;
        }
        // --------------------------------------------------------


        // FUNCTION | StartLoadingSequence - Orchestrates event-driven loading with dynamic/fallback logic
        // --------------------------------------------------------
        async function startLoadingSequence() {
            console.log('Starting event-driven loading sequence...');
            
            // Step 1: Create scene and setup basic components
            // ------------------------------------
            createScene();
            
            
            // Step 2: Check for project parameter and load model accordingly
            // ------------------------------------
            if (statusText) statusText.textContent = 'Loading 3D model...';
            console.log('Checking for project parameter...');
            
            const projectCode = getProjectCodeFromUrl();                  // <-- Get project code from URL
            
            if (projectCode) {
                // DYNAMIC LOADER PATH - Load from Whitecardopedia project data
                console.log(`[Orchestration] Project parameter detected: ${projectCode}`);
                console.log('[Orchestration] Using dynamic loader...');
                
                try {
                    await loadModelDynamically(projectCode);              // <-- Use dynamic loader
                    console.log('[Orchestration] Dynamic loader succeeded');
                } catch (error) {
                    console.error('[Orchestration] Dynamic loader failed:', error);
                    console.warn('[Orchestration] Falling back to basic loader...');
                    
                    if (statusText) statusText.textContent = 'Loading fallback model...';
                    await loadGLBModel();                                 // <-- Fallback to basic loader
                }
            } else {
                // BASIC LOADER PATH - Use default hardcoded model
                console.log('[Orchestration] No project parameter found');
                console.log('[Orchestration] Using basic loader with default model...');
                await loadGLBModel();                                     // <-- Use basic loader
            }
        }
        // --------------------------------------------------------


        // EVENT LISTENER | Handle materialsReady event and apply rendering pipeline
        // --------------------------------------------------------
        window.addEventListener('materialsReady', (event) => {
            console.log('Main: Received materialsReady event');
            
            if (statusText) statusText.textContent = 'Applying rendering effects...';
            
            const camera = scene.activeCamera;                               // <-- Get active camera
            
            if (camera && scene && engine) {
                console.log('Applying rendering pipeline...');
                setupWhitecardRenderingPipeline(camera, scene, engine);      // <-- Apply pipeline (will dispatch pipelineReady)
            } else {
                console.warn('Cannot apply rendering pipeline: missing camera, scene, or engine');
            }
        });
        // --------------------------------------------------------


        // EVENT LISTENER | Handle pipelineReady event and show scene
        // --------------------------------------------------------
        window.addEventListener('pipelineReady', () => {
            console.log('Main: Received pipelineReady event');
            
            if (statusText) statusText.textContent = 'Complete - ValeVision3D Ready';
            
            // Hide loading overlay with fade-out
            // ------------------------------------
            if (loadingOverlay) {
                console.log('Hiding loading overlay...');
                loadingOverlay.classList.add('hidden');
                
                // Remove overlay from DOM after fade-out completes
                // ------------------------------------
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 500);                                                     // <-- Match CSS transition duration
            }
            
            
            // Show canvas with fade-in animation
            // ------------------------------------
            if (canvas) {
                console.log('Showing canvas with fade-in...');
                canvas.classList.remove('canvas-hidden');
                canvas.classList.add('canvas-visible');
            }
            
            
            // Hide old loading indicator
            // ------------------------------------
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
            
            
            console.log('=========================================');
            console.log('=== ValeVision3D Initialization Complete ===');
            console.log('All systems ready - Scene visible');
            console.log('=========================================');
        });
        // --------------------------------------------------------


        // Initialize loading sequence
        // ------------------------------------
        startLoadingSequence();


        // Render loop
        // ------------------------------------
        engine.runRenderLoop(() => {
            scene.render();
        });


        // Handle window resize
        // ------------------------------------
        window.addEventListener('resize', () => {
            engine.resize();                                     // <-- Resize engine (handles device pixel ratio automatically)
        });

        // #endregion ---------------------------------------------
    </script>
    
    <!-- endregion -------------------------------------------------------- -->
