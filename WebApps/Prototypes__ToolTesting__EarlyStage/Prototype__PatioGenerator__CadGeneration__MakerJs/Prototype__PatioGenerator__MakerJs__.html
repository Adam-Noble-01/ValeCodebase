<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Patio Generator (Real-Time)</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bezier-js@2.1.0/dist/bezier.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@0.7.3/dist/opentype.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/makerjs@0/target/js/browser.maker.js"></script>

    <!-- CAD Generator Modules -->
    <script src="CadGenerator__ViewportAndNavigation.js"></script>
    <script src="CadGenerator__DynamicUI.js"></script>
    <script src="CadGenerator__DxfExportFunction.js"></script>

    <style>
        /* ---------------------------------------------------------------------
         * REGION | Page Layout Styles
         * ------------------------------------------------------------------ */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
        /* endregion -------------------------------------------------------- */
    </style>
</head>
<body>

    <!-- Control Panel (Built by DynamicUI) -->
    <div id="controls"></div>

    <!-- Canvas Wrapper (Managed by Viewport) -->
    <div id="canvas-wrapper"></div>
    
    <!-- Status Bar -->
    <div id="status-bar">Initializing...</div>

    <script>
        // ---------------------------------------------------------------------
        // REGION | UI Configuration (JSON Config Header)
        // ---------------------------------------------------------------------
        // INDEX: This config defines which UI elements are built
        // ┌────────────────────────────────────────────────────────────────────┐
        // │ INPUTS (All Sliders with double-click text entry):                 │
        // │   - pWidth   : Patio width in mm (1000-10000)                      │
        // │   - pHeight  : Patio height in mm (1000-8000)                      │
        // │   - pJoint   : Joint gap width in mm (0-30) → 0 = gapless hatch    │
        // │   - pModule  : Module/tile base size in mm (100-600)               │
        // │                                                                    │
        // │ BUTTONS:                                                           │
        // │   - regenerate-btn : Regenerates + resets view (zoomExtents)       │
        // │   - dxf-btn        : Downloads DXF file                            │
        // │                                                                    │
        // │ REAL-TIME: Sliders trigger onParamChange for live updates          │
        // │ TIP: Set Joint to 0 for gapless hatch pattern                      │
        // └────────────────────────────────────────────────────────────────────┘
        const UI_CONFIG = {
            containerId:      'controls',
            statusBarId:      'status-bar',
            canvasWrapperId:  'canvas-wrapper',
            loadingText:      'Loading CAD Libraries...',
            
            inputs: [
                { id: 'pWidth',  label: 'Width',  default: 5400, min: 1000, max: 10000, step: 100, unit: 'mm', onChange: 'onParamChange', width: '140px' },
                { id: 'pHeight', label: 'Height', default: 3600, min: 1000, max: 8000,  step: 100, unit: 'mm', onChange: 'onParamChange', width: '140px' },
                { id: 'pJoint',  label: 'Joint',  default: 10,   min: 0,    max: 30,    step: 1,   unit: 'mm', onChange: 'onParamChange', width: '120px', hint: '0 = gapless' },
                { id: 'pModule', label: 'Module', default: 300,  min: 100,  max: 600,   step: 50,  unit: 'mm', onChange: 'onParamChange', width: '120px' }
            ],
            
            buttons: [
                { id: 'regenerate-btn', label: 'Reset View',   action: 'onRegenerate',   style: 'primary' },
                { id: 'dxf-btn',        label: 'Download DXF', action: 'onDownloadDXF',  style: 'success' }
            ]
        };
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Global Origin (Single Source of Truth)
        // ---------------------------------------------------------------------
        const GLOBAL_ORIGIN = [0, 0];                                            // <-- Global 0,0 reference point
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Generator Configuration
        // ---------------------------------------------------------------------
        const GENERATOR_CONFIG = {
            filenamePrefix: 'Patio',                                             // <-- DXF filename prefix
            
            // Tile types: w/h in module units, weight for random selection
            tileTypes: [
                { w: 3, h: 2, weight: 12 },                                       // <-- 900x600
                { w: 2, h: 3, weight: 12 },                                       // <-- 600x900
                { w: 2, h: 2, weight: 20 },                                       // <-- 600x600
                { w: 2, h: 1, weight: 25 },                                       // <-- 600x300
                { w: 1, h: 2, weight: 25 },                                       // <-- 300x600
                { w: 1, h: 1, weight: 10 }                                        // <-- 300x300
            ]
        };
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Global State
        // ---------------------------------------------------------------------
        let currentModel = null;
        let guidesConfig = {                                                     // <-- Cached guides config
            showGround:  false,                                                  // <-- No ground line for patio
            showAxis:    false,                                                  // <-- No axis for patio
            strokeColor: '#555',
            fillColor:   '#e6e6e6'
        };
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | UI Event Handlers
        // ---------------------------------------------------------------------
        const UI_HANDLERS = {
            // Real-time update on any slider change (preserves camera)
            onParamChange: (paramId, value) => {
                regenerateModel(true);                                           // <-- preserveCamera = true
            },
            
            // Full regenerate with view reset
            onRegenerate: () => {
                regenerateModel(false);                                          // <-- preserveCamera = false
            },
            
            // DXF export
            onDownloadDXF: () => downloadDXF()
        };
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Main Generation Logic
        // ---------------------------------------------------------------------

        // FUNCTION | Regenerate model (optionally preserving camera)
        // ------------------------------------------------------------
        function regenerateModel(preserveCamera = false) {
            const UI       = window.CadGenerator.DynamicUI;
            const Viewport = window.CadGenerator.Viewport;
            const M        = Viewport.getMakerJS();

            if (!M) {
                UI.setStatus('Error: Maker.js library not loaded.');
                return;
            }

            try {
                // Generate model
                currentModel = generatePatio(M);
                
                // Render with camera preservation option
                Viewport.render(currentModel, guidesConfig, { 
                    preserveCamera: preserveCamera 
                });
                
                // Only zoom extents if not preserving camera
                if (!preserveCamera) {
                    Viewport.zoomExtents();
                }

                // Update status
                const tileCount = Object.keys(currentModel.models).length;
                const jointVal  = UI.getValue('pJoint');
                const modeText  = jointVal === 0 ? ' [Gapless Hatch Mode]' : '';
                UI.setStatus(`${tileCount} tiles${modeText}. Drag sliders for real-time preview.`);
            } catch (e) {
                console.error(e);
                UI.setStatus('Error: ' + e.message);
            }
        }
        // ---------------------------------------------------------------

        // FUNCTION | Generate patio model from current UI values
        // ------------------------------------------------------------
        function generatePatio(M) {
            const UI = window.CadGenerator.DynamicUI;

            // Inputs
            const widthMM  = parseInt(UI.getValue('pWidth'));
            const heightMM = parseInt(UI.getValue('pHeight'));
            const jointMM  = parseInt(UI.getValue('pJoint'));
            const moduleMM = parseInt(UI.getValue('pModule'));

            // Grid dimensions
            const gridW = Math.ceil(widthMM / moduleMM);
            const gridH = Math.ceil(heightMM / moduleMM);
            let grid    = Array(gridW).fill().map(() => Array(gridH).fill(false));
            
            // Model container
            let finalModel = { 
                models: {},
                units: M.unitType.Millimeter 
            };
            
            let idCounter = 0;

            // Simple packing algorithm
            for (let y = 0; y < gridH; y++) {
                for (let x = 0; x < gridW; x++) {
                    if (grid[x][y]) continue;

                    let placed     = false;
                    let candidates = getRandomizedList();

                    for (let t of candidates) {
                        if (canFit(grid, x, y, t.w, t.h, gridW, gridH)) {
                            addTile(M, finalModel, grid, x, y, t.w, t.h, moduleMM, jointMM, idCounter++);
                            placed = true;
                            break; 
                        }
                    }

                    if (!placed) {
                        // Fill gap with 1x1
                        addTile(M, finalModel, grid, x, y, 1, 1, moduleMM, jointMM, idCounter++);
                    }
                }
            }

            return finalModel;
        }
        // ---------------------------------------------------------------

        // FUNCTION | Download DXF file
        // ------------------------------------------------------------
        function downloadDXF() {
            const DxfExport = window.CadGenerator.DxfExport;
            DxfExport.download(currentModel, GENERATOR_CONFIG.filenamePrefix);
        }
        // ---------------------------------------------------------------
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Tile Helpers
        // ---------------------------------------------------------------------

        // FUNCTION | Add tile to model and mark grid
        // ------------------------------------------------------------
        function addTile(M, modelContainer, grid, x, y, w, h, modSize, joint, id) {
            // 1. Mark grid
            for (let i = 0; i < w; i++) {
                for (let j = 0; j < h; j++) {
                    grid[x + i][y + j] = true;
                }
            }

            // 2. Calculate geometry relative to GLOBAL_ORIGIN
            const pixelW  = (w * modSize) - joint;
            const pixelH  = (h * modSize) - joint;
            const originX = GLOBAL_ORIGIN[0] + (x * modSize) + (joint / 2);
            const originY = GLOBAL_ORIGIN[1] + (y * modSize) + (joint / 2);

            // 3. Create shape (manual paths for safety)
            const rect = {
                origin: [originX, originY],
                paths: {
                    b: new M.paths.Line([0, 0], [pixelW, 0]),
                    r: new M.paths.Line([pixelW, 0], [pixelW, pixelH]),
                    t: new M.paths.Line([pixelW, pixelH], [0, pixelH]),
                    l: new M.paths.Line([0, pixelH], [0, 0])
                }
            };

            modelContainer.models[`t_${id}`] = rect;
        }
        // ---------------------------------------------------------------

        // FUNCTION | Check if tile fits in grid
        // ------------------------------------------------------------
        function canFit(grid, x, y, w, h, limW, limH) {
            if (x + w > limW || y + h > limH) return false;
            
            for (let i = 0; i < w; i++) {
                for (let j = 0; j < h; j++) {
                    if (grid[x + i][y + j]) return false;
                }
            }
            return true;
        }
        // ---------------------------------------------------------------

        // FUNCTION | Get randomized tile type list
        // ------------------------------------------------------------
        function getRandomizedList() {
            let list = [...GENERATOR_CONFIG.tileTypes];
            
            // Sort by area with randomness
            list.sort((a, b) => {
                let sA = (a.w * a.h) * Math.random();
                let sB = (b.w * b.h) * Math.random();
                return sB - sA;
            });
            
            return list;
        }
        // ---------------------------------------------------------------
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Initialization
        // ---------------------------------------------------------------------
        window.onload = function() {
            const UI       = window.CadGenerator.DynamicUI;
            const Viewport = window.CadGenerator.Viewport;

            // Build UI from config
            UI.build(UI_CONFIG, UI_HANDLERS);

            // Initialize viewport
            Viewport.init('canvas-wrapper', {
                strokeColor: '#555',
                fillColor:   '#e6e6e6'
            });

            // Wait for MakerJS to load
            let attempts = 0;
            const checkInt = setInterval(() => {
                const M = Viewport.getMakerJS();
                if (M) {
                    clearInterval(checkInt);
                    UI.showLoading(false);
                    regenerateModel(false);                                      // <-- Initial render with zoomExtents
                } else if (attempts > 10) {
                    clearInterval(checkInt);
                    UI.setStatus('Failed to load libraries. Check connection.');
                }
                attempts++;
            }, 200);
        };
        // endregion -----------------------------------------------------------
    </script>
</body>
</html>
