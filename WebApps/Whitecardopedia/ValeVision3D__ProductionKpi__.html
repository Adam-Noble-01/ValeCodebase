<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ValeVision3D Production KPIs</title>

<!--
    =============================================================================
    VALEVISION3D - PRODUCTION KEY PERFORMANCE INDICATORS (EXTERNAL VIEW)
    =============================================================================

    FILE       : ValeVision3D__ProductionKpi__.html
    NAMESPACE  : Whitecardopedia
    MODULE     : External KPI Dashboard
    AUTHOR     : Adam Noble - Noble Architecture
    PURPOSE    : Give people outside the Whitecardopedia app the complete Time
                 Analysis Tool, every chart included, behind a shared access
                 phrase.
    CREATED    : 18-Aug-2026

    DESCRIPTION:
    - Mounts the real TimeAnalysisTool component rather than reimplementing it.
      Every chart, table and tooltip the in-app tool has is present here, and
      the two can never drift apart because there is only one implementation.
    - Passing no `onBack` puts the tool in standalone mode: the breadcrumb bar
      and the report-sharing button are hidden, since an external viewer has no
      gallery to return to and no need to generate emails.
    - Project data loads through Na__AppUtils__KpiProjectSource, which falls
      back from the localhost discovery API to the published master index, so
      the page works from GitHub Pages with no server behind it.

    ACCESS CONTROL - READ THIS BEFORE RELYING ON IT:
    - The access phrase is checked in the browser, so it is a deterrent that
      keeps casual visitors out. It is NOT cryptographic protection: anyone who
      opens developer tools can read the phrase, and the underlying project
      JSON is already publicly readable on the CDN.
    - Suitable for internal-but-shareable operational figures. Do not treat it
      as protection for anything confidential.

    -----------------------------------------------------------------------------

    DEVELOPMENT LOG:
    18-Aug-2026 - Version 1.0.0
    - Initial release: summary-only dashboard.

    18-Aug-2026 - Version 2.0.0
    - Replaced the bespoke summary with the full TimeAnalysisTool component, so
      external viewers get every interactive chart rather than a subset.

    =============================================================================
-->

<link rel="stylesheet" href="https://adam-noble-01.github.io/ValeCodebase/WebApps/Whitecardopedia/03__Style__AppStylesheets/Na__CoreUi__Styles__Variables__.css">
<link rel="stylesheet" href="https://adam-noble-01.github.io/ValeCodebase/WebApps/Whitecardopedia/03__Style__AppStylesheets/Na__CoreUi__Styles__App__.css">
<link rel="stylesheet" href="https://adam-noble-01.github.io/ValeCodebase/WebApps/Whitecardopedia/03__Style__AppStylesheets/Na__UiFeature__Styles__TimeAnalysis__.css">
<link rel="stylesheet" href="https://adam-noble-01.github.io/ValeCodebase/WebApps/Whitecardopedia/03__Style__AppStylesheets/Na__UiFeature__Styles__Tools__.css">

<style>
    /* -----------------------------------------------------------------------------
     * REGION | Access Gate
     * ----------------------------------------------------------------------------- */

    body {
        margin                             : 0;                              /* <-- Reset default margin */
        font-family                        : var(--Vale_FontFamily, 'Open Sans', sans-serif);
        background-color                   : var(--Vale_BackgroundLight, #f5f5f5);
        color                              : var(--Vale_TextPrimary, #172b3a);
    }

    .kpi-gate {
        position                           : fixed;                          /* <-- Cover the page until unlocked */
        inset                              : 0;
        background-color                   : var(--Vale_PrimaryBrand, #172b3a);
        display                            : flex;
        align-items                        : center;
        justify-content                    : center;
        z-index                            : 100;
    }

    .kpi-gate__card {
        background-color                   : var(--Vale_BackgroundWhite, #ffffff);
        border-radius                      : 8px;
        padding                            : 40px;
        width                              : min(420px, calc(100vw - 32px));
        text-align                         : center;
    }

    /* Three tiers: product name, descriptor, body copy. The name and the
     * descriptor were one string, which wrapped awkwardly at this card width
     * and gave the two halves equal visual weight. */
    .kpi-gate__title {
        margin                             : 0 0 2px 0;                      /* <-- Sits tight above the descriptor */
        font-size                          : 26px;                           /* <-- Product name leads */
        font-weight                        : 600;                            /* <-- Heaviest tier */
        letter-spacing                     : -0.2px;                         /* <-- Tighten the long name slightly */
    }

    .kpi-gate__subtitle {
        margin                             : 0 0 20px 0;                     /* <-- Space before the body copy */
        font-size                          : 17px;                           /* <-- Below the name, above the body */
        font-weight                        : 400;                            /* <-- Lighter than the name */
        color                              : var(--Vale_TextSecondary, #656565);
        letter-spacing                     : 0.3px;                          /* <-- Open it up a little */
    }

    .kpi-gate__intro {
        margin                             : 0 0 24px 0;
        font-size                          : 14px;
        color                              : var(--Vale_TextSecondary, #656565);
        line-height                        : 1.5;
    }

    .kpi-gate__input {
        width                              : 100%;
        padding                            : 12px;
        font-family                        : inherit;
        font-size                          : 18px;
        text-align                         : center;
        border                             : 2px solid var(--Vale_BorderLight, #cccccc);
        border-radius                      : 8px;
        margin-bottom                      : 16px;
    }

    .kpi-gate__button {
        width                              : 100%;
        padding                            : 12px 24px;
        font-family                        : inherit;
        font-size                          : 14px;
        font-weight                        : 600;
        color                              : #ffffff;
        background-color                   : var(--Vale_PrimaryBrand, #172b3a);
        border                             : none;
        border-radius                      : 8px;
        cursor                             : pointer;
    }

    .kpi-gate__button:hover { background-color: #0f1e28; }

    .kpi-gate__error {
        margin                             : 16px 0 0 0;
        font-size                          : 14px;
        color                              : #a3707a;                        /* <-- Muted rose, matching the app palette */
        min-height                         : 20px;
    }

    .kpi-boot {
        text-align                         : center;
        padding                            : 80px 24px;
        font-size                          : 18px;
        color                              : var(--Vale_TextSecondary, #656565);
    }

    /* endregion ------------------------------------------------------------------- */
</style>
</head>
<body>

<!-- ACCESS GATE -->
<div class="kpi-gate" id="kpiGate">
    <div class="kpi-gate__card">
        <h1 class="kpi-gate__title">ValeVision3D</h1>
        <p class="kpi-gate__subtitle">Production KPIs</p>
        <p class="kpi-gate__intro">
            Performance metrics for the Vale Garden Houses 3D Visualisation
            Department. Enter the access phrase you were sent to continue.
        </p>
        <input type="password" id="kpiGateInput" class="kpi-gate__input"
               placeholder="Access phrase" autocomplete="off" spellcheck="false">
        <button type="button" id="kpiGateButton" class="kpi-gate__button">View Metrics</button>
        <p class="kpi-gate__error" id="kpiGateError"></p>
    </div>
</div>

<!-- THE TOOL MOUNTS HERE -->
<div id="kpiRoot"><div class="kpi-boot" id="kpiBoot">Preparing dashboard...</div></div>
<div id="tooltip" class="tooltip"></div>

<!-- THIRD PARTY | React, Babel and D3, matching the versions app.html uses -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>

<script>
// -----------------------------------------------------------------------------
// REGION | Configuration
// -----------------------------------------------------------------------------

    // MODULE CONSTANTS | Access Control and Module Sources
    // ------------------------------------------------------------
    // Module URLs are absolute production URLs: this page is opened from an
    // emailed link and must resolve identically wherever it is served from.
    // ------------------------------------------------------------
    var KPI_ACCESS_PHRASE = 'VisDptKpi';                                     // <-- Shared access phrase (browser-side deterrent)
    var KPI_SESSION_KEY   = 'valevision_kpi_access';                         // <-- Remembers the gate for this tab session

    var KPI_MODULE_BASE   = 'https://adam-noble-01.github.io/ValeCodebase/WebApps/Whitecardopedia/02__Src__AppModules/';

    // Order matters: each module depends on the ones above it.
    var KPI_MODULES = [
        '05__AppUtils/Na__AppUtils__TimeAdjustments.js',                      // <-- Offset / net hour arithmetic
        '05__AppUtils/Na__AppUtils__ProductionKpiStats.js',                   // <-- Shared KPI engine
        '05__AppUtils/Na__AppUtils__KpiProjectSource.js',                     // <-- Production capable project loader
        '02__AppCore/Na__AppCore__Header.jsx',                                // <-- Logo band
        '02__AppCore/Na__AppCore__Breadcrumbs.jsx',                           // <-- Referenced by the tool, inert standalone
        '13__Feature__TimeAnalysis/Na__Feature__TimeAnalysis__Main.jsx'       // <-- The tool itself
    ];
    // ------------------------------------------------------------

// endregion -------------------------------------------------------------------


// -----------------------------------------------------------------------------
// REGION | Access Gate
// -----------------------------------------------------------------------------

    // FUNCTION | Validate the Entered Access Phrase
    // ------------------------------------------------------------
    function na_kpi_check_access() {
        var entered = document.getElementById('kpiGateInput').value.trim();
        var errorEl = document.getElementById('kpiGateError');

        if (entered !== KPI_ACCESS_PHRASE) {                                 // <-- Reject anything else
            errorEl.textContent = 'That access phrase was not recognised.';
            document.getElementById('kpiGateInput').value = '';
            return;
        }

        try { sessionStorage.setItem(KPI_SESSION_KEY, '1'); } catch (e) {}   // <-- Remember for this tab session
        na_kpi_unlock();
    }
    // ---------------------------------------------------------------

    // FUNCTION | Hide the Gate and Boot the Tool
    // ------------------------------------------------------------
    function na_kpi_unlock() {
        document.getElementById('kpiGate').style.display = 'none';
        na_kpi_boot_tool();
    }
    // ---------------------------------------------------------------

// endregion -------------------------------------------------------------------


// -----------------------------------------------------------------------------
// REGION | Module Loading and Mount
// -----------------------------------------------------------------------------

    // HELPER FUNCTION | Fetch and Transpile One Module
    // ------------------------------------------------------------
    // The app's modules are plain scripts and JSX served as .js/.jsx, so they
    // are fetched as text, transpiled, then appended as classic <script>
    // elements. That mirrors how app.html loads them via type="text/babel" and
    // keeps the modules free of any build step.
    //
    // Deliberately NOT eval: indirect eval hoists `var` and function
    // declarations to the global object but discards top-level `let`/`const`.
    // These modules declare all their constants with `const`, so eval would
    // drop them and the tool would fail on the first constant it touched.
    // ------------------------------------------------------------
    function na_kpi_load_module(relativePath) {
        var url = KPI_MODULE_BASE + relativePath;

        return fetch(url)
            .then(function (response) {
                if (!response.ok) throw new Error(relativePath + ' (' + response.status + ')');
                return response.text();
            })
            .then(function (source) {
                var compiled = Babel.transform(source, { presets: ['react'] }).code;  // <-- JSX to plain JS

                return new Promise(function (resolve, reject) {
                    var script = document.createElement('script');                    // <-- Classic script, not eval
                    script.textContent = compiled;
                    script.dataset.kpiModule = relativePath;                          // <-- Traceable in devtools

                    try {
                        document.head.appendChild(script);                            // <-- Runs synchronously on append
                        resolve();
                    } catch (error) {
                        reject(new Error(relativePath + ': ' + error.message));
                    }
                });
            });
    }
    // ---------------------------------------------------------------

    // FUNCTION | Load Every Module In Order, Then Render the Tool
    // ------------------------------------------------------------
    function na_kpi_boot_tool() {
        var bootEl = document.getElementById('kpiBoot');

        var chain = Promise.resolve();
        KPI_MODULES.forEach(function (modulePath) {                          // <-- Strictly sequential: later modules depend on earlier
            chain = chain.then(function () {
                bootEl.textContent = 'Preparing dashboard...';
                return na_kpi_load_module(modulePath);
            });
        });

        chain
            .then(function () {
                var root = ReactDOM.createRoot(document.getElementById('kpiRoot'));
                root.render(React.createElement(TimeAnalysisTool, {}));       // <-- No onBack: standalone mode
            })
            .catch(function (error) {
                bootEl.textContent = 'Could not load the dashboard: ' + error.message;
                console.error('KPI dashboard boot failed:', error);
            });
    }
    // ---------------------------------------------------------------

// endregion -------------------------------------------------------------------


// -----------------------------------------------------------------------------
// REGION | Boot
// -----------------------------------------------------------------------------

    document.getElementById('kpiGateButton').addEventListener('click', na_kpi_check_access);
    document.getElementById('kpiGateInput').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') na_kpi_check_access();                    // <-- Enter submits
    });

    try {
        if (sessionStorage.getItem(KPI_SESSION_KEY) === '1') na_kpi_unlock(); // <-- Skip the gate within a session
        else document.getElementById('kpiGateInput').focus();
    } catch (e) {
        document.getElementById('kpiGateInput').focus();
    }

// endregion -------------------------------------------------------------------
</script>

</body>
</html>
