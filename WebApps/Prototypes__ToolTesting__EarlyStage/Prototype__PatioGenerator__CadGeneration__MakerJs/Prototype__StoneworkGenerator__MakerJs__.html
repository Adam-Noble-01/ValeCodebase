<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Stonework Generator (Real-Time)</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bezier-js@2.1.0/dist/bezier.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@0.7.3/dist/opentype.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/makerjs@0/target/js/browser.maker.js"></script>

    <!-- CAD Generator Modules -->
    <script src="CadGenerator__ViewportAndNavigation.js"></script>
    <script src="CadGenerator__DynamicUI.js"></script>
    <script src="CadGenerator__DxfExportFunction.js"></script>

    <style>
        /* ---------------------------------------------------------------------
         * REGION | Page Layout Styles
         * ------------------------------------------------------------------ */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        /* ---------------------------------------------------------------------
         * REGION | Mode Selector Buttons
         * ------------------------------------------------------------------ */
        .selector-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .selector-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .selector-label {
            font-weight: 600;
            color: #555;
            font-size: 13px;
        }
        
        .selector-btn {
            padding: 6px 14px;
            border: 2px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .selector-btn:hover {
            border-color: #5A6A75;
        }
        
        .selector-btn.active {
            border-color: #5A6A75;
            background: #5A6A75;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Mode Selectors Row -->
    <div class="selector-row">
        <!-- Stone Size Selector -->
        <div class="selector-group">
            <span class="selector-label">Size:</span>
            <button class="selector-btn" data-group="size" data-value="small">Small</button>
            <button class="selector-btn active" data-group="size" data-value="medium">Medium</button>
            <button class="selector-btn" data-group="size" data-value="large">Large</button>
        </div>
        
        <!-- Pattern Type Selector -->
        <div class="selector-group">
            <span class="selector-label">Pattern:</span>
            <button class="selector-btn active" data-group="pattern" data-value="uncoursed">Uncoursed / Snecked</button>
            <button class="selector-btn" data-group="pattern" data-value="coursed">Coursed Rough</button>
        </div>
        
        <!-- Render Mode Selector -->
        <div class="selector-group">
            <span class="selector-label">Mode:</span>
            <button class="selector-btn active" data-group="render" data-value="continuous">Continuous</button>
            <button class="selector-btn" data-group="render" data-value="artistic">Artistic (Ruined)</button>
        </div>
    </div>

    <!-- Control Panel (Built by DynamicUI) -->
    <div id="controls"></div>

    <!-- Canvas Wrapper (Managed by Viewport) -->
    <div id="canvas-wrapper"></div>
    
    <!-- Status Bar -->
    <div id="status-bar">Initializing...</div>

    <script>
        // ---------------------------------------------------------------------
        // REGION | UI Configuration (JSON Config Header)
        // ---------------------------------------------------------------------
        const UI_CONFIG = {
            containerId:      'controls',
            statusBarId:      'status-bar',
            canvasWrapperId:  'canvas-wrapper',
            loadingText:      'Loading CAD Libraries...',
            
            inputs:[
                { id: 'pWidth',     label: 'Width',     default: 2500, min: 500, max: 8000, step: 100, unit: 'mm', onChange: 'onParamChange',   width: '110px' },
                { id: 'pHeight',    label: 'Height',    default: 1800, min: 300, max: 5000, step: 100, unit: 'mm', onChange: 'onParamChange',   width: '110px' },
                { id: 'pMortar',    label: 'Mortar',    default: 15,   min: 0,   max: 30,   step: 1,   unit: 'mm', onChange: 'onParamChange',   width: '110px', hint: '0 = gapless' },
                { id: 'pTumbled',   label: 'Tumbled',   default: 0,    min: 0,   max: 30,   step: 1,   unit: 'mm', onChange: 'onParamChange',   width: '110px', hint: 'Corner Radius' },
                { id: 'pRoughness', label: 'Roughness', default: 0,    min: 0,   max: 20,   step: 1,   unit: 'mm', onChange: 'onParamChange',   width: '110px', hint: 'Edge Distortion' },
                { id: 'pDensity',   label: 'Density',   default: 50,   min: 0,   max: 100,  step: 1,   unit: '%',  onChange: 'onDensityChange', width: '110px', hint: 'Artistic mode' }
            ],
            
            buttons:[
                { id: 'regenerate-btn', label: 'Randomize Pattern', action: 'onRegenerate',   style: 'primary' },
                { id: 'dxf-btn',        label: 'Download DXF',      action: 'onDownloadDXF',  style: 'success' }
            ]
        };

        // ---------------------------------------------------------------------
        // REGION | Global Origin & Configurations
        // ---------------------------------------------------------------------
        const GLOBAL_ORIGIN = [0, 0];

        const GENERATOR_CONFIG = {
            filenamePrefix: 'Stonework',
            noiseScale:     0.012
        };

        const STONE_SIZES = {
            small:  { baseUnit: 40, minW: 100, maxW: 300, courseMinH: 60,  courseMaxH: 150 },
            medium: { baseUnit: 65, minW: 150, maxW: 450, courseMinH: 100, courseMaxH: 220 },
            large:  { baseUnit: 90, minW: 200, maxW: 600, courseMinH: 150, courseMaxH: 300 }
        };

        const PATTERN_TYPES = { coursed: 'coursed', uncoursed: 'uncoursed' };
        const RENDER_MODES  = { continuous: 'continuous', artistic: 'artistic' };

        let currentModel      = null;
        let currentSize       = 'medium';
        let currentPattern    = PATTERN_TYPES.uncoursed;
        let currentRenderMode = RENDER_MODES.continuous;
        let noiseSeed         = Math.random() * 10000;
        let mathSeed          = noiseSeed;

        let guidesConfig = {
            showGround:  false,
            showAxis:    false,
            strokeColor: '#3C4A52',
            fillColor:   '#B0B9C0'
        };

        // ---------------------------------------------------------------------
        // REGION | UI Event Handlers
        // ---------------------------------------------------------------------
        const UI_HANDLERS = {
            onParamChange: (paramId, value) => regenerateModel(true),
            onDensityChange: (paramId, value) => regenerateModel(true), 
            onRegenerate: () => {
                noiseSeed = Math.random() * 10000;
                regenerateModel(false);
            },
            onDownloadDXF: () => {
                const DxfExport = window.CadGenerator.DxfExport;
                DxfExport.download(currentModel, GENERATOR_CONFIG.filenamePrefix);
            }
        };

        function setupModeSelectors() {
            document.querySelectorAll('.selector-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const group = btn.dataset.group;
                    const value = btn.dataset.value;
                    
                    document.querySelectorAll(`.selector-btn[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    switch (group) {
                        case 'size':    currentSize = value; break;
                        case 'pattern': currentPattern = value; break;
                        case 'render':  currentRenderMode = value; break;
                    }
                    
                    noiseSeed = Math.random() * 10000;
                    regenerateModel(false);
                });
            });
        }

        // ---------------------------------------------------------------------
        // REGION | Math & Noise Functions
        // ---------------------------------------------------------------------
        function seedRandom(seed) { mathSeed = seed; }

        function random() {
            let t = mathSeed += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }

        function noise2D(x, y, seed) {
            const hash = (ix, iy) => {
                const h = ix * 374761393 + iy * 668265263 + seed * 1013904223;
                let t = h + 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
            
            const ix = Math.floor(x);
            const iy = Math.floor(y);
            const fx = x - ix;
            const fy = y - iy;
            
            const sx = fx * fx * (3 - 2 * fx);
            const sy = fy * fy * (3 - 2 * fy);
            
            const n00 = hash(ix, iy);
            const n10 = hash(ix + 1, iy);
            const n01 = hash(ix, iy + 1);
            const n11 = hash(ix + 1, iy + 1);
            
            const nx0 = n00 + sx * (n10 - n00);
            const nx1 = n01 + sx * (n11 - n01);
            
            return nx0 + sy * (nx1 - nx0);
        }

        function fbmNoise(x, y, seed, octaves = 3) {
            let value = 0, amplitude = 1, frequency = 1, maxValue = 0;
            for (let i = 0; i < octaves; i++) {
                value += amplitude * noise2D(x * frequency, y * frequency, seed + i * 1000);
                maxValue += amplitude;
                amplitude *= 0.5;
                frequency *= 2;
            }
            return value / maxValue;
        }

        // ---------------------------------------------------------------------
        // REGION | Main Generation Logic
        // ---------------------------------------------------------------------
        function regenerateModel(preserveCamera = false) {
            const UI       = window.CadGenerator.DynamicUI;
            const Viewport = window.CadGenerator.Viewport;
            const M        = Viewport.getMakerJS();

            if (!M) return;

            try {
                currentModel = generateStonework(M);
                
                // FIXED: Removed Viewport.init() from here. It was wiping the 
                // camera state back to {x: 0, y: 0, scale: 1} on every parameter change!
                
                Viewport.render(currentModel, guidesConfig, { preserveCamera: preserveCamera });
                
                if (!preserveCamera) Viewport.zoomExtents();

                const stoneCount = Object.keys(currentModel.models).length;
                const patternLabel = currentPattern === 'coursed' ? 'Coursed' : 'Uncoursed';
                const sizeLabel = currentSize.charAt(0).toUpperCase() + currentSize.slice(1);
                const modeLabel = currentRenderMode === 'artistic' ? `[Ruined ${UI.getValue('pDensity')}%]` : '';
                
                UI.setStatus(`${stoneCount} stones | ${sizeLabel} | ${patternLabel}${modeLabel}`);
            } catch (e) {
                console.error(e);
                UI.setStatus('Error: ' + e.message);
            }
        }

        function generateStonework(M) {
            const UI = window.CadGenerator.DynamicUI;

            const panelWidth  = parseInt(UI.getValue('pWidth'));
            const panelHeight = parseInt(UI.getValue('pHeight'));
            const mortarMM    = parseInt(UI.getValue('pMortar'));
            const tumbledRadius = parseFloat(UI.getValue('pTumbled')) || 0;
            const roughnessAmp  = parseFloat(UI.getValue('pRoughness')) || 0;
            
            seedRandom(noiseSeed);

            let stones = currentPattern === PATTERN_TYPES.coursed 
                ? getCoursedStones(panelWidth, panelHeight) 
                : getUncoursedStones(panelWidth, panelHeight);

            let finalModel = { models: {}, units: M.unitType.Millimeter };
            let idCounter = 0;

            const densityPct = parseInt(UI.getValue('pDensity'));
            const densityThreshold = densityPct / 100;

            for (const stone of stones) {
                if (currentRenderMode === RENDER_MODES.artistic) {
                    const cx = stone.x + (stone.w / 2);
                    const cy = stone.y + (stone.h / 2);
                    
                    const noiseVal = fbmNoise(cx * GENERATOR_CONFIG.noiseScale, cy * GENERATOR_CONFIG.noiseScale, noiseSeed, 3);
                    if (noiseVal > densityThreshold) continue;
                }
                
                const clipped = clipStoneToPanel(stone.x, stone.y, stone.w, stone.h, mortarMM, panelWidth, panelHeight);
                
                if (clipped) {
                    addStonePoly(M, finalModel, clipped.x, clipped.y, clipped.w, clipped.h, idCounter++, tumbledRadius, roughnessAmp);
                }
            }

            return finalModel;
        }

        // ---------------------------------------------------------------------
        // REGION | Pattern Generators
        // ---------------------------------------------------------------------
        function getCoursedStones(panelWidth, panelHeight) {
            const stones = [], sizes = STONE_SIZES[currentSize];
            let y = GLOBAL_ORIGIN[1];
            const maxY = GLOBAL_ORIGIN[1] + panelHeight;

            while (y < maxY) {
                let h = sizes.courseMinH + random() * (sizes.courseMaxH - sizes.courseMinH);
                let x = GLOBAL_ORIGIN[0];
                while (x < panelWidth) {
                    let w = sizes.minW + random() * (sizes.maxW - sizes.minW);
                    if (panelWidth - x < sizes.minW * 1.5) w = panelWidth - x;
                    stones.push({ x: x, y: y, w: w, h: h });
                    x += w;
                }
                y += h;
            }
            return stones;
        }

        function getUncoursedStones(panelWidth, panelHeight) {
            const stones = [], sizes = STONE_SIZES[currentSize];
            const baseUnit = sizes.baseUnit, minH = baseUnit, maxH = baseUnit * 4;
            let skyline =[{ x: 0, w: panelWidth, y: GLOBAL_ORIGIN[1] }];
            const maxY = GLOBAL_ORIGIN[1] + panelHeight;

            let safety = 0;
            while (safety++ < 20000) {
                let minSegY = Infinity, segIdx = -1;
                for (let i = 0; i < skyline.length; i++) {
                    if (skyline[i].y < minSegY) { minSegY = skyline[i].y; segIdx = i; }
                }

                if (minSegY >= maxY) break;

                let seg = skyline[segIdx];
                let w = sizes.minW + random() * (sizes.maxW - sizes.minW);
                if (w > seg.w) w = seg.w;
                if (seg.w - w < sizes.minW) w = seg.w;

                let targetYs =[];
                if (segIdx > 0 && skyline[segIdx - 1].y > seg.y) targetYs.push(skyline[segIdx - 1].y);
                if (segIdx < skyline.length - 1 && w === seg.w && skyline[segIdx + 1].y > seg.y) targetYs.push(skyline[segIdx + 1].y);

                let h = 0;
                if (targetYs.length > 0 && random() < 0.60) {
                    let target = targetYs[Math.floor(random() * targetYs.length)];
                    let diff = target - seg.y;
                    if (diff >= minH && diff <= maxH && (diff % baseUnit === 0)) h = diff;
                }

                if (h === 0) {
                    let kRoll = random(), k = 1;
                    if (kRoll > 0.4) k = 2;
                    if (kRoll > 0.8) k = 3;
                    if (kRoll > 0.95) k = 4;
                    h = k * baseUnit;
                }

                stones.push({ x: seg.x, y: seg.y, w: w, h: h });

                if (w === seg.w) {
                    skyline[segIdx].y += h;
                } else {
                    skyline.splice(segIdx, 1, { x: seg.x, w: w, y: seg.y + h }, { x: seg.x + w, w: seg.w - w, y: seg.y });
                }

                for (let j = skyline.length - 1; j > 0; j--) {
                    if (Math.abs(skyline[j].y - skyline[j - 1].y) < 1) {
                        skyline[j - 1].w += skyline[j].w;
                        skyline.splice(j, 1);
                    }
                }
            }
            return stones;
        }

        // ---------------------------------------------------------------------
        // REGION | Helpers
        // ---------------------------------------------------------------------
        function clipStoneToPanel(x, y, w, h, mortar, panelWidth, panelHeight) {
            let sx = x + (mortar / 2), sy = y + (mortar / 2);
            let sw = w - mortar, sh = h - mortar;
            
            if (mortar === 0) { sx = x; sy = y; sw = w; sh = h; }
            
            if (sx < GLOBAL_ORIGIN[0]) { const clip = GLOBAL_ORIGIN[0] - sx; sx = GLOBAL_ORIGIN[0]; sw -= clip; }
            if (sx + sw > panelWidth) sw = panelWidth - sx;
            if (sy + sh > panelHeight) sh = panelHeight - sy;
            
            if (sw <= 0 || sh <= 0 || sx >= panelWidth || sy >= panelHeight) return null;
            return { x: sx, y: sy, w: sw, h: sh };
        }

        function addStonePoly(M, modelContainer, x, y, w, h, id, radius, roughness) {
            let r = Math.min(radius, w / 2, h / 2);
            if (r < 0) r = 0;

            let points =[];
            let resolution = 8; // Generate a point every 8mm for detailed edges

            function addLine(x1, y1, x2, y2) {
                let dx = x2 - x1, dy = y2 - y1;
                let len = Math.sqrt(dx*dx + dy*dy);
                if (len <= 0.01) return;
                let steps = Math.max(1, Math.ceil(len / resolution));
                for (let i = 0; i < steps; i++) {
                    let t = i / steps;
                    points.push([x1 + dx * t, y1 + dy * t]);
                }
            }

            function addArc(cx, cy, arcRadius, startAngle, endAngle) {
                if (arcRadius <= 0.01) return;
                let angleDiff = endAngle - startAngle;
                let arcLen = Math.abs(angleDiff) * arcRadius;
                let steps = Math.max(1, Math.ceil(arcLen / resolution));
                for (let i = 0; i < steps; i++) {
                    let t = i / steps;
                    let a = startAngle + angleDiff * t;
                    points.push([cx + Math.cos(a) * arcRadius, cy + Math.sin(a) * arcRadius]);
                }
            }

            addLine(r, 0, w-r, 0);
            if (r > 0) addArc(w-r, r, r, -Math.PI/2, 0);

            addLine(w, r, w, h-r);
            if (r > 0) addArc(w-r, h-r, r, 0, Math.PI/2);

            addLine(w-r, h, r, h);
            if (r > 0) addArc(r, h-r, r, Math.PI/2, Math.PI);

            addLine(0, h-r, 0, r);
            if (r > 0) addArc(r, r, r, Math.PI, Math.PI*1.5);

            if (roughness > 0) {
                const ns = 0.03; 
                for (let i = 0; i < points.length; i++) {
                    let px = points[i][0] + x;
                    let py = points[i][1] + y;
                    
                    let nx = fbmNoise(px * ns, py * ns, noiseSeed) * 2 - 1;
                    let ny = fbmNoise(px * ns, py * ns, noiseSeed + 10000) * 2 - 1;

                    points[i][0] += nx * roughness;
                    points[i][1] += ny * roughness;
                }
            }

            modelContainer.models[`stone_${id}`] = new M.models.ConnectTheDots(true, points);
            modelContainer.models[`stone_${id}`].origin = [x, y];
        }

        // ---------------------------------------------------------------------
        // REGION | Initialization
        // ---------------------------------------------------------------------
        window.onload = function() {
            const UI       = window.CadGenerator.DynamicUI;
            const Viewport = window.CadGenerator.Viewport;

            UI.build(UI_CONFIG, UI_HANDLERS);
            setupModeSelectors();

            Viewport.init('canvas-wrapper', guidesConfig);

            let attempts = 0;
            const checkInt = setInterval(() => {
                const M = Viewport.getMakerJS();
                if (M) {
                    clearInterval(checkInt);
                    UI.showLoading(false);
                    regenerateModel(false);
                } else if (attempts > 15) {
                    clearInterval(checkInt);
                    UI.setStatus('Failed to load libraries. Check connection.');
                }
                attempts++;
            }, 200);
        };
    </script>
</body>
</html>
