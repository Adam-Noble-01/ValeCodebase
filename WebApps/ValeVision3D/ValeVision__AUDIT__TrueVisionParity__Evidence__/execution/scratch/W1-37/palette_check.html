<!doctype html>
<!--
  W1-37 check page (scratch, never shipped). Served by the Whitecardopedia Flask server at
  http://localhost:8000/ValeVision3D/ValeVision__AUDIT__TrueVisionParity__Evidence__/execution/scratch/W1-37/palette_check.html
  It loads ValeVision's real CSS index (which now imports the Colour Palette's stylesheet) and mounts the real
  Plan Annotations toolbar from the live tree into a #root like the 3D tab's, with the toolbar's real imports.
  Nothing here saves anything; no project is loaded. window.W137_Run() runs the checks and returns the result.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>W1-37 Colour Palette Check</title>
    <script type="importmap">
    {
        "imports": {
            "three" : "../../../../04__Lib__ThirdParty__VersionLocked/01__Vendor__ThreeJs__v0.184.0/build/three.module.js"
        }
    }
    </script>
    <link rel="stylesheet" href="../../../../03__Style__AppStylesheets/Na__CoreUi__Styles__Index__.css">
    <style>
        html, body  { margin : 0; height : 100%; background : #dfe5ea; font-family : 'Open Sans', Arial, sans-serif; }
        #root       { position : fixed; inset : 0; }
        .w137-head  { position : fixed; left : 0; right : 0; top : 0; height : 60px; background : #172b3a; color : #fff; display : flex; align-items : center; padding : 0 16px; font-size : 14px; }
        .w137-out   { position : fixed; left : 16px; bottom : 16px; width : 560px; max-height : 45vh; overflow : auto; background : #fff; border : 1px solid #ccd3d8; padding : 8px; font : 11px/1.4 monospace; white-space : pre-wrap; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="w137-head">W1-37 - the Plan Annotations toolbar's dimension colour and the Colour Palette (scratch check page)</div>
    <div class="w137-out" id="w137Out">loading...</div>

    <script type="module">
        import { Na__PlanAnnoBar__Mount, Na__PlanAnnoBar__Unmount } from '../../../../02__Src__AppModules/43__System__PlanAnnotations/Na__PlanAnnotations__Toolbar__.js';
        import { Na__ColourPalette__Ready, Na__ColourPalette__IsAvailable, Na__ColourPalette__IsOpen, Na__ColourPalette__Close } from '../../../../02__Src__AppModules/54__Feature__ColourPalette/Na__ColourPalette__.js';

        const out = document.getElementById('w137Out');
        Na__PlanAnnoBar__Mount({ hostElement : document.getElementById('root'), onDone () {} });
        out.textContent = 'toolbar mounted; window.W137_Run() runs the checks';

        // THE PALETTE'S STYLESHEET, reached through the CSS index's @import chain
        function sheetHrefs(list, acc) {
            Array.from(list).forEach((sheet) => {
                if (sheet.href) acc.push(sheet.href);
                let rules = [];
                try { rules = Array.from(sheet.cssRules || []); } catch (error) { rules = []; }
                rules.forEach((rule) => { if (rule.styleSheet) sheetHrefs([ rule.styleSheet ], acc); });
            });
            return acc;
        }

        window.W137_Run = async function () {
            const result = { checks : [], notes : {} };
            const check  = (label, got, want) => result.checks.push({ ok : JSON.stringify(got) === JSON.stringify(want), label, got, want });

            await Na__ColourPalette__Ready();
            const hrefs = sheetHrefs(document.styleSheets, []);
            check('the CSS index imports the palette stylesheet (it is in the page\'s @import chain, after Boot)',
                [ hrefs.some((h) => /54__Feature__ColourPalette\/Na__ColourPalette__Styles__\.css$/.test(h)),
                  hrefs.findIndex((h) => /Na__ColourPalette__Styles__\.css$/.test(h)) > hrefs.findIndex((h) => /Na__LayoutEditor__Styles__Boot__\.css$/.test(h)) ], [ true, true ]);
            check('the palette config loaded and the palette is available', Na__ColourPalette__IsAvailable(), true);

            const field = document.querySelector('#naPlanAnnotationToolbar .na-plan-anno__swatch');
            check('the toolbar has its dimension colour field', [ !!field, field && field.type ], [ true, 'color' ]);
            const box = field.getBoundingClientRect();
            result.notes.fieldBox = { left : Math.round(box.left), top : Math.round(box.top), width : Math.round(box.width), height : Math.round(box.height) };
            result.notes.window = { innerWidth : window.innerWidth, innerHeight : window.innerHeight, outerWidth : window.outerWidth, devicePixelRatio : window.devicePixelRatio };

            const heard = [];
            const onInput  = () => heard.push('input:' + field.value);
            const onChange = () => heard.push('change:' + field.value);
            field.addEventListener('input', onInput);
            field.addEventListener('change', onChange);

            // A click on the field (script-made: the palette opens, the browser refuses its own mixer without a user gesture)
            field.focus();
            const click = new MouseEvent('click', { bubbles : true, cancelable : true });
            field.dispatchEvent(click);
            const root  = document.querySelector('.na-colour-palette');
            const proxy = document.querySelector('.na-colour-palette__proxy');
            check('a click on the dimension colour is taken from the browser and opens the palette', [ click.defaultPrevented, Na__ColourPalette__IsOpen(), !!root && !root.hidden ], [ true, true, true ]);
            const cs = root ? getComputedStyle(root) : null;
            let declared = null;                                                       // <-- The sheet's own rule: a computed 1px border snaps to device pixels (0.67px at 150 %)
            (function findRule(list) {
                Array.from(list).forEach((sheet) => {
                    let rules = [];
                    try { rules = Array.from(sheet.cssRules || []); } catch (error) { rules = []; }
                    rules.forEach((rule) => {
                        if (rule.styleSheet) findRule([ rule.styleSheet ]);
                        else if (rule.selectorText === '.na-colour-palette' && /Na__ColourPalette__Styles__\.css$/.test(sheet.href || '')) declared = rule.style.getPropertyValue('border');
                    });
                });
            })(document.styleSheets);
            check('the palette is styled by its sheet: fixed to the window over everything (z 1300), white, ringed in the panels\' grey',
                cs ? [ cs.position, cs.zIndex, cs.backgroundColor, cs.borderTopColor, declared ] : null,
                [ 'fixed', '1300', 'rgb(255, 255, 255)', 'rgb(204, 211, 216)', '1px solid rgb(204, 211, 216)' ]);
            check('titled with the Vale name, Monochrome (10) then Dimensions (3) swatches of 22 px',
                [ root.querySelector('.na-colour-palette__title') && root.querySelector('.na-colour-palette__title').textContent,
                  Array.from(root.querySelectorAll('.na-colour-palette__row')).map((r) => r.querySelectorAll('.na-colour-palette__swatch').length),
                  Math.round(root.querySelector('.na-colour-palette__swatch').getBoundingClientRect().width) ],
                [ 'Vale Garden Houses Standard', [ 10, 3 ], 22 ]);
            const pbox = root.getBoundingClientRect();
            const xbox = proxy ? proxy.getBoundingClientRect() : null;
            result.notes.place = root.getAttribute('data-na-colour-place');
            result.notes.paletteBox = { left : Math.round(pbox.left), top : Math.round(pbox.top), width : Math.round(pbox.width), height : Math.round(pbox.height) };
            result.notes.proxyBox   = xbox ? { left : Math.round(xbox.left), top : Math.round(xbox.top), width : Math.round(xbox.width), height : Math.round(xbox.height) } : null;
            check('it sits inside the window, clear of the field, with the proxy strip (the mixer\'s hanging point) above it',
                [ pbox.left >= 8, pbox.top >= 8, pbox.right <= window.innerWidth - 8, pbox.bottom <= window.innerHeight - 8,
                  !(pbox.left < box.right && pbox.right > box.left && pbox.top < box.bottom && pbox.bottom > box.top),
                  !!xbox && xbox.height === 1 && xbox.top < pbox.top, proxy && getComputedStyle(proxy).opacity, proxy && getComputedStyle(proxy).pointerEvents ],
                [ true, true, true, true, true, true, '0', 'none' ]);
            check('the swatch for the field\'s colour is ringed', Array.from(root.querySelectorAll('.na-colour-palette__swatch.is-current')).map((s) => s.getAttribute('data-na-colour-key')),
                field.value.toLowerCase() === '#960000' ? [ 'ColourPalette__Dimensions__Proposed' ] : Array.from(root.querySelectorAll('.na-colour-palette__swatch.is-current')).map((s) => s.getAttribute('data-na-colour-key')));
            result.notes.fieldColourBefore = field.value;

            // THE PICK
            const existing = root.querySelector('[data-na-colour-key="ColourPalette__Dimensions__Existing"]');
            existing.click();
            check('a swatch pick puts Existing in the field: input, then change', [ field.value, heard ], [ '#000096', [ 'input:#000096', 'change:#000096' ] ]);
            check('and the field lets go of the focus; the palette and the proxy are gone',
                [ document.activeElement === field, Na__ColourPalette__IsOpen(), root.hidden, document.querySelectorAll('.na-colour-palette__proxy').length ], [ false, false, true, 0 ]);

            // A DISABLED FIELD gets the browser's own menu only
            field.disabled = true;
            const click2 = new MouseEvent('click', { bubbles : true, cancelable : true });
            field.dispatchEvent(click2);
            check('a disabled field: the click is not taken and no palette opens', [ click2.defaultPrevented, Na__ColourPalette__IsOpen() ], [ false, false ]);
            field.disabled = false;

            // OPEN AGAIN for the screenshot (Escape closes it)
            field.dispatchEvent(new MouseEvent('click', { bubbles : true, cancelable : true }));
            result.notes.reopened = Na__ColourPalette__IsOpen();
            document.dispatchEvent(new KeyboardEvent('keydown', { key : 'Escape', bubbles : true }));
            check('Escape closes it', Na__ColourPalette__IsOpen(), false);
            field.dispatchEvent(new MouseEvent('click', { bubbles : true, cancelable : true }));

            field.removeEventListener('input', onInput);
            field.removeEventListener('change', onChange);
            result.passed = result.checks.filter((c) => c.ok).length;
            result.failed = result.checks.filter((c) => !c.ok).length;
            out.textContent = result.checks.map((c) => (c.ok ? 'PASS  ' : 'FAIL  ') + c.label + (c.ok ? '' : '\n      got ' + JSON.stringify(c.got) + '\n      want ' + JSON.stringify(c.want))).join('\n')
                + '\n\n' + result.passed + ' passed, ' + result.failed + ' failed\n' + JSON.stringify(result.notes);
            window.W137_Result = result;
            return result;
        };
    </script>
</body>
</html>
