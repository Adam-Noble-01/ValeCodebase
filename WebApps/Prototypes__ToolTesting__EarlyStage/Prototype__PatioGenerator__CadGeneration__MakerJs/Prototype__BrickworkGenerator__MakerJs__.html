<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Brickwork Generator (Real-Time)</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bezier-js@2.1.0/dist/bezier.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@0.7.3/dist/opentype.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/makerjs@0/target/js/browser.maker.js"></script>

    <!-- CAD Generator Modules -->
    <script src="CadGenerator__ViewportAndNavigation.js"></script>
    <script src="CadGenerator__DynamicUI.js"></script>
    <script src="CadGenerator__DxfExportFunction.js"></script>

    <style>
        /* ---------------------------------------------------------------------
         * REGION | Page Layout Styles
         * ------------------------------------------------------------------ */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
        /* endregion -------------------------------------------------------- */

        /* ---------------------------------------------------------------------
         * REGION | Mode Selector Buttons
         * ------------------------------------------------------------------ */
        .selector-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .selector-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .selector-label {
            font-weight: 600;
            color: #555;
            font-size: 13px;
        }
        
        .selector-btn {
            padding: 6px 14px;
            border: 2px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .selector-btn:hover {
            border-color: #8B4513;
        }
        
        .selector-btn.active {
            border-color: #8B4513;
            background: #8B4513;
            color: white;
        }
        /* endregion -------------------------------------------------------- */
    </style>
</head>
<body>

    <!-- Mode Selectors Row -->
    <div class="selector-row">
        <!-- Unit System Selector -->
        <div class="selector-group">
            <span class="selector-label">Units:</span>
            <button class="selector-btn active" data-group="unit" data-value="imperial">Imperial</button>
            <button class="selector-btn" data-group="unit" data-value="metric">Metric</button>
        </div>
        
        <!-- Bond Type Selector -->
        <div class="selector-group">
            <span class="selector-label">Bond:</span>
            <button class="selector-btn active" data-group="bond" data-value="stretcher">Stretcher</button>
            <button class="selector-btn" data-group="bond" data-value="flemish">Flemish</button>
            <button class="selector-btn" data-group="bond" data-value="english">English</button>
        </div>
        
        <!-- Render Mode Selector -->
        <div class="selector-group">
            <span class="selector-label">Mode:</span>
            <button class="selector-btn active" data-group="render" data-value="continuous">Continuous</button>
            <button class="selector-btn" data-group="render" data-value="artistic">Artistic</button>
        </div>
    </div>

    <!-- Control Panel (Built by DynamicUI) -->
    <div id="controls"></div>

    <!-- Canvas Wrapper (Managed by Viewport) -->
    <div id="canvas-wrapper"></div>
    
    <!-- Status Bar -->
    <div id="status-bar">Initializing...</div>

    <script>
        // ---------------------------------------------------------------------
        // REGION | UI Configuration (JSON Config Header)
        // ---------------------------------------------------------------------
        // INDEX: This config defines which UI elements are built
        // ┌────────────────────────────────────────────────────────────────────┐
        // │ INPUTS (All Sliders with double-click text entry):                 │
        // │   - pWidth    : Panel width in mm (500-6000)                       │
        // │   - pHeight   : Panel height in mm (300-4000)                      │
        // │   - pMortar   : Mortar joint width in mm (0-15) → 0 = gapless      │
        // │   - pDensity  : Artistic mode brick density (0-100%) → 50 default  │
        // │                                                                    │
        // │ BUTTONS:                                                           │
        // │   - regenerate-btn : Regenerates + resets view (zoomExtents)       │
        // │   - dxf-btn        : Downloads DXF file                            │
        // │                                                                    │
        // │ MODE SELECTORS (Button Groups above controls):                     │
        // │   - Unit System : Imperial (215x65) / Metric (230x76)              │
        // │   - Bond Type   : Stretcher / Flemish / English                    │
        // │   - Render Mode : Continuous / Artistic                            │
        // │                                                                    │
        // │ REAL-TIME: Sliders trigger onParamChange for live updates          │
        // │ TIP: Set Mortar to 0 for gapless hatch pattern                     │
        // │ TIP: Density slider randomizes seed on each drag for variation     │
        // └────────────────────────────────────────────────────────────────────┘
        const UI_CONFIG = {
            containerId:      'controls',
            statusBarId:      'status-bar',
            canvasWrapperId:  'canvas-wrapper',
            loadingText:      'Loading CAD Libraries...',
            
            inputs: [
                { id: 'pWidth',   label: 'Width',   default: 2000, min: 500, max: 6000, step: 100, unit: 'mm', onChange: 'onParamChange',   width: '140px' },
                { id: 'pHeight',  label: 'Height',  default: 1500, min: 300, max: 4000, step: 75,  unit: 'mm', onChange: 'onParamChange',   width: '140px' },
                { id: 'pMortar',  label: 'Mortar',  default: 10,   min: 0,   max: 15,   step: 1,   unit: 'mm', onChange: 'onParamChange',   width: '120px', hint: '0 = gapless' },
                { id: 'pDensity', label: 'Density', default: 50,   min: 0,   max: 100,  step: 1,   unit: '%',  onChange: 'onDensityChange', width: '120px', hint: 'Artistic mode' }
            ],
            
            buttons: [
                { id: 'regenerate-btn', label: 'Reset View',   action: 'onRegenerate',   style: 'primary' },
                { id: 'dxf-btn',        label: 'Download DXF', action: 'onDownloadDXF',  style: 'success' }
            ]
        };
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Global Origin (Single Source of Truth)
        // ---------------------------------------------------------------------
        const GLOBAL_ORIGIN = [0, 0];                                            // <-- Global 0,0 reference point
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Generator Configuration
        // ---------------------------------------------------------------------
        const GENERATOR_CONFIG = {
            filenamePrefix: 'Brickwork',                                         // <-- DXF filename prefix
            noiseScale:     0.015                                                // <-- Scale for noise sampling (lower = larger clusters)
        };

        // Brick dimensions by unit system (width x height in mm)
        const BRICK_SIZES = {
            imperial: { width: 215, height: 65, header: 102.5 },                 // <-- UK standard brick
            metric:   { width: 230, height: 76, header: 110 }                    // <-- Euro modular brick
        };

        // Bond type constants
        const BOND_TYPES = {
            stretcher: 'stretcher',
            flemish:   'flemish',
            english:   'english'
        };

        // Render mode constants
        const RENDER_MODES = {
            continuous: 'continuous',
            artistic:   'artistic'
        };
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Global State
        // ---------------------------------------------------------------------
        let currentModel      = null;
        let currentUnitSystem = 'imperial';                                      // <-- Default unit system
        let currentBondType   = BOND_TYPES.stretcher;                            // <-- Default bond type
        let currentRenderMode = RENDER_MODES.continuous;                         // <-- Default render mode
        let noiseSeed         = Math.random() * 10000;                           // <-- Random seed for noise

        let guidesConfig = {                                                     // <-- Cached guides config
            showGround:  false,                                                  // <-- No ground line
            showAxis:    false,                                                  // <-- No axis
            strokeColor: '#8B4513',                                              // <-- Brick brown stroke
            fillColor:   '#DEB887'                                               // <-- Burlywood fill
        };
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | UI Event Handlers
        // ---------------------------------------------------------------------
        const UI_HANDLERS = {
            // Real-time update on any slider change (preserves camera)
            onParamChange: (paramId, value) => {
                regenerateModel(true);                                           // <-- preserveCamera = true
            },
            
            // Density slider: randomize seed + regenerate (for variation)
            onDensityChange: (paramId, value) => {
                noiseSeed = Math.random() * 10000;                               // <-- New random seed on each drag
                regenerateModel(true);                                           // <-- preserveCamera = true
            },
            
            // Full regenerate with view reset
            onRegenerate: () => {
                regenerateModel(false);                                          // <-- preserveCamera = false
            },
            
            // DXF export
            onDownloadDXF: () => downloadDXF()
        };

        // Setup mode selector buttons
        function setupModeSelectors() {
            document.querySelectorAll('.selector-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const group = btn.dataset.group;
                    const value = btn.dataset.value;
                    
                    // Update active state within group
                    document.querySelectorAll(`.selector-btn[data-group="${group}"]`).forEach(b => {
                        b.classList.remove('active');
                    });
                    btn.classList.add('active');
                    
                    // Update global state
                    switch (group) {
                        case 'unit':
                            currentUnitSystem = value;
                            break;
                        case 'bond':
                            currentBondType = value;
                            break;
                        case 'render':
                            currentRenderMode = value;
                            break;
                    }
                    
                    // Regenerate with view reset for mode changes
                    regenerateModel(false);
                });
            });
        }
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Noise Functions (Seeded Pseudo-Random for Clustering)
        // ---------------------------------------------------------------------
        
        // FUNCTION | Seeded random number generator (Mulberry32)
        // ------------------------------------------------------------
        function seededRandom(seed) {
            let t = seed += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
        // ---------------------------------------------------------------

        // FUNCTION | 2D Value Noise with seeded randomness
        // ------------------------------------------------------------
        function noise2D(x, y, seed) {
            // Hash function for grid coordinates
            const hash = (ix, iy) => {
                const h = ix * 374761393 + iy * 668265263 + seed * 1013904223;
                return seededRandom(h);
            };
            
            // Grid cell coordinates
            const ix = Math.floor(x);
            const iy = Math.floor(y);
            
            // Fractional position within cell
            const fx = x - ix;
            const fy = y - iy;
            
            // Smooth interpolation (smoothstep)
            const sx = fx * fx * (3 - 2 * fx);
            const sy = fy * fy * (3 - 2 * fy);
            
            // Corner values
            const n00 = hash(ix, iy);
            const n10 = hash(ix + 1, iy);
            const n01 = hash(ix, iy + 1);
            const n11 = hash(ix + 1, iy + 1);
            
            // Bilinear interpolation
            const nx0 = n00 + sx * (n10 - n00);
            const nx1 = n01 + sx * (n11 - n01);
            
            return nx0 + sy * (nx1 - nx0);
        }
        // ---------------------------------------------------------------

        // FUNCTION | Fractal Brownian Motion (multi-octave noise)
        // ------------------------------------------------------------
        function fbmNoise(x, y, seed, octaves = 3) {
            let value = 0;
            let amplitude = 1;
            let frequency = 1;
            let maxValue = 0;
            
            for (let i = 0; i < octaves; i++) {
                value += amplitude * noise2D(x * frequency, y * frequency, seed + i * 1000);
                maxValue += amplitude;
                amplitude *= 0.5;
                frequency *= 2;
            }
            
            return value / maxValue;                                             // <-- Normalize to 0-1
        }
        // ---------------------------------------------------------------
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Main Generation Logic
        // ---------------------------------------------------------------------

        // FUNCTION | Regenerate model (optionally preserving camera)
        // ------------------------------------------------------------
        function regenerateModel(preserveCamera = false) {
            const UI       = window.CadGenerator.DynamicUI;
            const Viewport = window.CadGenerator.Viewport;
            const M        = Viewport.getMakerJS();

            if (!M) {
                UI.setStatus('Error: Maker.js library not loaded.');
                return;
            }

            try {
                // Generate model
                currentModel = generateBrickwork(M);
                
                // Render with camera preservation option
                Viewport.render(currentModel, guidesConfig, { 
                    preserveCamera: preserveCamera 
                });
                
                // Only zoom extents if not preserving camera
                if (!preserveCamera) {
                    Viewport.zoomExtents();
                }

                // Update status
                const brickCount = Object.keys(currentModel.models).length;
                const bondLabel  = { stretcher: 'Stretcher', flemish: 'Flemish', english: 'English' }[currentBondType];
                const unitLabel  = currentUnitSystem === 'imperial' ? 'Imperial' : 'Metric';
                const mortarVal  = UI.getValue('pMortar');
                const densityVal = UI.getValue('pDensity');
                const gaplessText = mortarVal === 0 ? ' [Gapless]' : '';
                const modeLabel  = currentRenderMode === 'artistic' ? ` [Artistic ${densityVal}%]` : '';
                
                UI.setStatus(`${brickCount} bricks | ${bondLabel} Bond | ${unitLabel}${modeLabel}${gaplessText}`);
            } catch (e) {
                console.error(e);
                UI.setStatus('Error: ' + e.message);
            }
        }
        // ---------------------------------------------------------------

        // FUNCTION | Generate brickwork model from current UI values
        // ------------------------------------------------------------
        function generateBrickwork(M) {
            const UI = window.CadGenerator.DynamicUI;

            // Inputs
            const panelWidth  = parseInt(UI.getValue('pWidth'));
            const panelHeight = parseInt(UI.getValue('pHeight'));
            const mortarMM    = parseInt(UI.getValue('pMortar'));

            // Get brick dimensions for current unit system
            const brickSize = BRICK_SIZES[currentUnitSystem];
            const brickW    = brickSize.width;                                   // <-- Stretcher width
            const brickH    = brickSize.height;                                  // <-- Brick height
            const headerW   = brickSize.header;                                  // <-- Header width
            
            // Course height includes mortar
            const courseH = brickH + mortarMM;
            
            // Model container
            let finalModel = { 
                models: {},
                units: M.unitType.Millimeter 
            };
            
            let idCounter = 0;

            // Calculate number of courses
            const numCourses = Math.ceil(panelHeight / courseH);

            // Get density threshold for artistic mode (0% density = all removed, 100% = all visible)
            const densityPct = parseInt(UI.getValue('pDensity'));
            const densityThreshold = densityPct / 100;                           // <-- 0.0 to 1.0
            const noiseScale = GENERATOR_CONFIG.noiseScale;

            // Generate each course
            for (let course = 0; course < numCourses; course++) {
                const courseY = GLOBAL_ORIGIN[1] + (course * courseH);
                
                // Get bricks for this course based on bond type
                const bricks = getBricksForCourse(course, panelWidth, brickW, headerW, mortarMM);
                
                // Add each brick
                for (const brick of bricks) {
                    // Artistic mode: noise-based skip for organic clustering
                    if (currentRenderMode === RENDER_MODES.artistic) {
                        // Sample noise at brick center position
                        const brickCenterX = brick.x + (brick.w / 2);
                        const brickCenterY = courseY + (brickH / 2);
                        
                        // Get noise value (0-1) at this position
                        const noiseVal = fbmNoise(
                            brickCenterX * noiseScale,
                            brickCenterY * noiseScale,
                            noiseSeed,
                            3                                                    // <-- 3 octaves for organic look
                        );
                        
                        // Skip brick if noise exceeds density threshold
                        // Higher density = more bricks visible (noiseVal must be higher to skip)
                        if (noiseVal > densityThreshold) {
                            continue;                                            // <-- Skip this brick
                        }
                    }
                    
                    // Clip brick to panel bounds
                    const clipped = clipBrickToPanel(brick.x, courseY, brick.w, brickH, mortarMM, panelWidth, panelHeight);
                    
                    if (clipped) {
                        addBrickRect(M, finalModel, clipped.x, clipped.y, clipped.w, clipped.h, idCounter++);
                    }
                }
            }

            return finalModel;
        }
        // ---------------------------------------------------------------

        // FUNCTION | Download DXF file
        // ------------------------------------------------------------
        function downloadDXF() {
            const DxfExport = window.CadGenerator.DxfExport;
            DxfExport.download(currentModel, GENERATOR_CONFIG.filenamePrefix);
        }
        // ---------------------------------------------------------------
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Bond Pattern Generators
        // ---------------------------------------------------------------------

        // FUNCTION | Get bricks for a course based on bond type
        // ------------------------------------------------------------
        function getBricksForCourse(courseIndex, panelWidth, brickW, headerW, mortar) {
            switch (currentBondType) {
                case BOND_TYPES.flemish:
                    return getFlemishCourseBricks(courseIndex, panelWidth, brickW, headerW, mortar);
                case BOND_TYPES.english:
                    return getEnglishCourseBricks(courseIndex, panelWidth, brickW, headerW, mortar);
                case BOND_TYPES.stretcher:
                default:
                    return getStretcherCourseBricks(courseIndex, panelWidth, brickW, mortar);
            }
        }
        // ---------------------------------------------------------------

        // FUNCTION | Stretcher Bond - All stretchers, half brick offset
        // ------------------------------------------------------------
        function getStretcherCourseBricks(courseIndex, panelWidth, brickW, mortar) {
            const bricks = [];
            const unitW  = brickW + mortar;                                      // <-- Brick + mortar width
            
            // Offset odd courses by half brick
            const offset = (courseIndex % 2 === 1) ? (unitW / 2) : 0;
            
            // Start position (may be negative for offset courses)
            let x = GLOBAL_ORIGIN[0] - offset;
            
            // Generate bricks across panel width
            while (x < panelWidth) {
                bricks.push({ x: x, w: brickW });
                x += unitW;
            }
            
            return bricks;
        }
        // ---------------------------------------------------------------

        // FUNCTION | Flemish Bond - Alternating stretcher/header per course
        // ------------------------------------------------------------
        function getFlemishCourseBricks(courseIndex, panelWidth, brickW, headerW, mortar) {
            const bricks = [];
            
            // Pattern unit: stretcher + header + 2 mortars
            const stretcherUnit = brickW + mortar;
            const headerUnit    = headerW + mortar;
            const patternUnit   = stretcherUnit + headerUnit;
            
            // Offset odd courses by half pattern
            const offset = (courseIndex % 2 === 1) ? (patternUnit / 2) : 0;
            
            let x = GLOBAL_ORIGIN[0] - offset;
            let isStretcher = true;
            
            while (x < panelWidth) {
                if (isStretcher) {
                    bricks.push({ x: x, w: brickW });
                    x += stretcherUnit;
                } else {
                    bricks.push({ x: x, w: headerW });
                    x += headerUnit;
                }
                isStretcher = !isStretcher;
            }
            
            return bricks;
        }
        // ---------------------------------------------------------------

        // FUNCTION | English Bond - Alternate courses of stretchers/headers
        // ------------------------------------------------------------
        function getEnglishCourseBricks(courseIndex, panelWidth, brickW, headerW, mortar) {
            const bricks = [];
            
            // Even courses = stretchers, Odd courses = headers
            const isStretcherCourse = (courseIndex % 2 === 0);
            
            if (isStretcherCourse) {
                // Stretcher course - offset by quarter brick for alignment
                const unitW  = brickW + mortar;
                const offset = (Math.floor(courseIndex / 2) % 2 === 1) ? (unitW / 2) : 0;
                
                let x = GLOBAL_ORIGIN[0] - offset;
                
                while (x < panelWidth) {
                    bricks.push({ x: x, w: brickW });
                    x += unitW;
                }
            } else {
                // Header course - no offset needed, headers fill width
                const unitW = headerW + mortar;
                let x = GLOBAL_ORIGIN[0];
                
                while (x < panelWidth) {
                    bricks.push({ x: x, w: headerW });
                    x += unitW;
                }
            }
            
            return bricks;
        }
        // ---------------------------------------------------------------
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Brick Helpers
        // ---------------------------------------------------------------------

        // FUNCTION | Clip brick to panel boundaries
        // ------------------------------------------------------------
        function clipBrickToPanel(x, y, w, h, mortar, panelWidth, panelHeight) {
            // Calculate actual brick dimensions (subtract mortar for spacing)
            let brickX = x + (mortar / 2);
            let brickY = y + (mortar / 2);
            let brickW = w - (mortar > 0 ? 0 : 0);                               // <-- Full width, mortar handled by spacing
            let brickH = h - (mortar > 0 ? 0 : 0);                               // <-- Full height
            
            // For gapless mode (mortar = 0), bricks touch
            if (mortar === 0) {
                brickX = x;
                brickY = y;
            }
            
            // Clip left edge
            if (brickX < GLOBAL_ORIGIN[0]) {
                const clipAmount = GLOBAL_ORIGIN[0] - brickX;
                brickX = GLOBAL_ORIGIN[0];
                brickW -= clipAmount;
            }
            
            // Clip right edge
            if (brickX + brickW > panelWidth) {
                brickW = panelWidth - brickX;
            }
            
            // Clip top edge
            if (brickY + brickH > panelHeight) {
                brickH = panelHeight - brickY;
            }
            
            // Skip if brick is too small or outside bounds
            if (brickW <= 0 || brickH <= 0 || brickX >= panelWidth || brickY >= panelHeight) {
                return null;
            }
            
            return { x: brickX, y: brickY, w: brickW, h: brickH };
        }
        // ---------------------------------------------------------------

        // FUNCTION | Add brick rectangle to model
        // ------------------------------------------------------------
        function addBrickRect(M, modelContainer, x, y, w, h, id) {
            // Create rectangle using manual paths (4 lines)
            const rect = {
                origin: [x, y],
                paths: {
                    b: new M.paths.Line([0, 0], [w, 0]),                          // <-- Bottom
                    r: new M.paths.Line([w, 0], [w, h]),                          // <-- Right
                    t: new M.paths.Line([w, h], [0, h]),                          // <-- Top
                    l: new M.paths.Line([0, h], [0, 0])                           // <-- Left
                }
            };

            modelContainer.models[`brick_${id}`] = rect;
        }
        // ---------------------------------------------------------------
        // endregion -----------------------------------------------------------

        // ---------------------------------------------------------------------
        // REGION | Initialization
        // ---------------------------------------------------------------------
        window.onload = function() {
            const UI       = window.CadGenerator.DynamicUI;
            const Viewport = window.CadGenerator.Viewport;

            // Build UI from config
            UI.build(UI_CONFIG, UI_HANDLERS);
            
            // Setup mode selector buttons
            setupModeSelectors();

            // Initialize viewport
            Viewport.init('canvas-wrapper', {
                strokeColor: '#8B4513',                                          // <-- Brick brown
                fillColor:   '#DEB887'                                           // <-- Burlywood
            });

            // Wait for MakerJS to load
            let attempts = 0;
            const checkInt = setInterval(() => {
                const M = Viewport.getMakerJS();
                if (M) {
                    clearInterval(checkInt);
                    UI.showLoading(false);
                    regenerateModel(false);                                      // <-- Initial render with zoomExtents
                } else if (attempts > 10) {
                    clearInterval(checkInt);
                    UI.setStatus('Failed to load libraries. Check connection.');
                }
                attempts++;
            }, 200);
        };
        // endregion -----------------------------------------------------------
    </script>
</body>
</html>
