<!DOCTYPE html>
<!-- =============================================================================
     WHITECARDOPEDIA - GITHUB PAGES 404 HANDLER
     =============================================================================
     
     FILE       : 404.html
     NAMESPACE  : Whitecardopedia
     AUTHOR     : Adam Noble - Noble Architecture
     PURPOSE    : GitHub Pages 404 redirect handler for deep link URLs
     CREATED    : 10-Dec-2025
     
     DESCRIPTION:
     - Handles 404 errors when users access deep link URLs on GitHub Pages
     - Saves the original URL path to sessionStorage
     - Redirects to app.html which restores the URL and loads the project
     - Enables shareable project URLs on static hosting (GitHub Pages)
     
     HOW IT WORKS:
     1. User visits: https://adam-noble-01.github.io/ValeCodebase/WebApps/Whitecardopedia/projects2025/55876
     2. GitHub Pages returns 404 (no file exists at that path)
     3. This 404.html saves the path to sessionStorage
     4. Redirects to app.html
     5. app.html restores the URL from sessionStorage
     6. React app detects deep link and loads the project
     
     =============================================================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Whitecardopedia - Vale Garden Houses</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    
    <script>
        // SET BASE TAG DYNAMICALLY BASED ON HOSTNAME
        (function() {
            const base = document.createElement('base');
            if (window.location.hostname.includes('github.io')) {
                base.href = '/ValeCodebase/WebApps/Whitecardopedia/';  // <-- GitHub Pages subdirectory
            } else {
                base.href = '/';                                        // <-- Localhost root
            }
            document.head.insertBefore(base, document.head.firstChild.nextSibling);
        })();
    </script>
    
    <link rel="icon" type="image/svg+xml" href="../assets__CommonApplicationAssets/AppIcons/Icon__MainValeIcon__.svg">
    <meta name="theme-color" content="#172b3a">
    
    <style>
        body {
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f7fa;
            color: #172b3a;
        }
        .loading {
            text-align: center;
        }
        .loading h1 {
            font-size: 1.5rem;
            font-weight: 400;
            margin: 0;
        }
        .spinner {
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #172b3a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    <script>
        // GITHUB PAGES 404 HANDLER | Save original path and redirect to app.html
        (function() {
            // SAVE THE ORIGINAL PATH TO SESSION STORAGE
            sessionStorage.setItem('whitecardopedia_redirect', location.pathname + location.search + location.hash);
            
            // REDIRECT TO APP.HTML
            // Use absolute path for GitHub Pages subdirectory
            location.replace('/ValeCodebase/WebApps/Whitecardopedia/app.html');
        })();
    </script>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <h1>Loading project...</h1>
    </div>
</body>
</html>
