<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>W4-11 context menu harness</title>
<link rel="stylesheet" href="../../../../03__Style__AppStylesheets/Na__CoreUi__Styles__Index__.css">
<style>body { margin: 0; height: 100vh; background: #e8ecef; } #outside { position: absolute; left: 600px; top: 400px; width: 80px; height: 40px; background: #ccc; }</style>
</head>
<body>
<div id="outside">outside</div>
<script type="module">
    import { Na__ContextMenu__Ui__Open, Na__ContextMenu__Ui__Close, Na__ContextMenu__Ui__IsOpen }
        from '../../../../02__Src__AppModules/27__System__ContextMenuSystem/Na__ContextMenuSystem__Ui__MenuRenderer__.js';

    window.W411 = { log: [], dismissed: 0 };
    window.W411.open = () => Na__ContextMenu__Ui__Open('Picture', [
        { id: 'justify', rows: [
            { label: 'Justify left',   isActive: true, action: () => window.W411.log.push('left') },
            { label: 'Justify centre', action: () => window.W411.log.push('centre') }
        ] },
        { id: 'edit', rows: [
            { label: 'Crop', meta: 'Figure 1', action: () => window.W411.log.push('crop') }
        ] }
    ], 120, 140, () => { window.W411.dismissed += 1; });
    window.W411.isOpen = Na__ContextMenu__Ui__IsOpen;
    window.W411.close  = Na__ContextMenu__Ui__Close;
    window.W411.ready  = true;
</script>
</body>
</html>
